<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$subject</title>
</head>
<body style="margin:0;padding:0;background-color:#f2efe9;color:#1a2b31;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f2efe9">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width:560px;border:1px solid #ded0b7;border-top:3px solid #b18c5c;">
<tr><td style="padding:25px 26px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td width="38" height="38" align="center" bgcolor="#1a2b31" style="color:#ead5ae;border-radius:50%;font:15px Georgia,Cambria,serif;">MG</td>
      <td style="padding-left:11px;color:#1a2b31;font:17px Georgia,Cambria,serif;">Mariusz Gorlowski</td>
    </tr>
  </table>
</td></tr>
$items_start
<tr><td style="padding:26px 26px 0;">
  <h1 style="margin:0 0 15px;color:#1a2b31;font:normal 30px/1.18 Georgia,Cambria,serif;">$essay_title</h1>
  <p style="margin:0 0 22px;color:#46575c;font:16px/1.65 Arial,sans-serif;">$essay_teaser</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0">
    <tr><td bgcolor="#1a2b31" style="border-radius:6px;mso-padding-alt:13px 20px;">
      <a href="$essay_url" style="display:inline-block;padding:13px 20px;border-radius:6px;color:#ffffff;background-color:#1a2b31;font:bold 15px/1.4 Arial,sans-serif;text-decoration:none;mso-padding-alt:0;">$read_label</a>
    </td></tr>
  </table>
</td></tr>
$items_end
<tr><td style="padding:24px 26px 30px;color:#1a2b31;font:italic 19px/1.55 Georgia,Cambria,serif;">Mariusz Gorlowski</td></tr>
<tr><td bgcolor="#faf8f3" style="padding:15px 26px;border-top:1px solid #e8e0d1;color:#46575c;font:13px/1.55 Arial,sans-serif;">
  <p style="margin:0 0 5px;">$footer</p>
  <p style="margin:0;"><a href="{{ unsubscribe }}" style="color:#46575c;text-decoration:underline;">$unsubscribe_label</a> · <a href="$privacy_url" style="color:#46575c;text-decoration:underline;">$privacy_label</a></p>
</td></tr>
</table>
</td></tr>
</table>
</body></html>
