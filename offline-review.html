cznie.\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"pet-example\">\u003ch3 id=\"pet-example\">Przykład: profil zwierzęcia\u003c/h3>\n\u003cp>Wyobraź sobie, że ktoś znajduje Twojego psa. Nie zna jego zachowania, nie wie, czy boi się hałasu, ma alergię albo przyjmuje leki.\u003c/p>\n\u003cp>Rozbudowany, bezpłatny profil zwierzęcia w QR FINDER pozwala zapisać przydatne informacje o wyglądzie, zachowaniu, mikroczipie i opiece weterynaryjnej, a także istotne zalecenia zdrowotne. Właściciel wybiera, które dodatkowe dane zobaczy znalazca.\u003c/p>\n\u003cp>Dzięki temu zawieszka może przekazać znacznie więcej niż numer telefonu, a właściciel nadal decyduje, jakie informacje są widoczne. To było pierwsze i najbardziej rozbudowane bezpłatne zastosowanie QR FINDER, lecz system nie ogranicza się do zwierząt.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"stickers\">\u003ch3 id=\"stickers\">Naklejki informacyjne — nowe możliwości\u003c/h3>\n\u003cp>Przedmiot nie musi zaginąć, żeby dodatkowe informacje na jego temat były przydatne. Dlatego rozwijam także naklejki informacyjne QR FINDER do codziennego użytku.\u003c/p>\n\u003cp>Rower, sprzęt elektroniczny, narzędzia, przedmioty domowe, części zamienne czy rzeczy wymagające instrukcji albo historii użytkowania — zastosowań jest wiele. Zamiast przechowywać informacje w kilku miejscach, można powiązać je z konkretnym przedmiotem i otworzyć po zeskanowaniu kodu.\u003c/p>\n\u003cp>W zależności od profilu dostępne funkcje mogą obejmować zdjęcia, licznik skanowań, notatnik, kalendarz dat i przypomnień oraz kalkulator do prostych obliczeń.\u003c/p>\n\u003cp>Bardziej rozbudowane rejestry, dokumenty i historie mogą być dostępne w osobnych, płatnych Bookach. Tych funkcji premium nie należy mylić z podstawowym bezpłatnym profilem.\u003c/p>\n\u003ch3>Publicznie czy prywatnie? Ty decydujesz.\u003c/h3>\n\u003cp>\u003cstrong>Publicznie:\u003c/strong> wybrane informacje są dostępne dla każdej osoby, która zeskanuje naklejkę. Może to być przydatne w przypadku instrukcji, danych kontaktowych lub innych treści przeznaczonych do udostępnienia.\u003c/p>\n\u003cp>\u003cstrong>Prywatnie:\u003c/strong> dostęp do informacji chroni hasło. To rozwiązanie dla osób, które chcą prowadzić cyfrowy rejestr, ale nie zamierzają udostępniać go wszystkim.\u003c/p>\n\u003cp>Zasada pozostaje prosta: niewielka naklejka połączona z przydatnymi informacjami cyfrowymi, dostosowana do różnych potrzeb.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"large-format\">\u003ch3 id=\"large-format\">Naklejki wielkoformatowe — do samochodów i nie tylko\u003c/h3>\n\u003cp>Opracowałem też większe projekty naklejek do samochodów i innych zastosowań, w których kod powinien być dobrze widoczny.\u003c/p>\n\u003cp>Większy format ma umożliwiać skanowanie z dalszej odległości, o ile pozwalają na to oświetlenie i inne warunki. Może zapewnić szybki dostęp do cyfrowej wizytówki, danych kontaktowych lub wybranych informacji bez ręcznego wpisywania adresu strony.\u003c/p>\n\u003cp>Samochód jest tylko jednym z przykładów. Podobne rozwiązanie może być użyteczne wszędzie tam, gdzie znaczenie ma dobra widoczność kodu.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"whats-next\">\u003ch3 id=\"whats-next\">Projekt, który stale się rozwija\u003c/h3>\n\u003cp>QR FINDER nie rozwijał się według jednego niezmiennego planu. Wiele pomysłów powstało podczas projektowania kolejnych produktów i zastanawiania się, jak ludzie mogliby z nich korzystać.\u003c/p>\n\u003cp>Mam jeszcze wiele pomysłów, które chciałbym zrealizować, ale wolę przedstawiać nowe funkcje wtedy, gdy będą gotowe, zamiast składać obietnice zbyt wcześnie. O kolejnych postępach będę informował na bieżąco.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"why\">\u003ch3 id=\"why\">Dlaczego stworzyłem QR FINDER\u003c/h3>\n\u003cp>Nie mogę obiecać, że każde zagubione zwierzę lub przedmiot zostaną odnalezione. Zawieszka QR FINDER nie śledzi położenia rzeczy i nie jest lokalizatorem GPS.\u003c/p>\n\u003cp>Chciałem jednak dać osobie, która znajdzie ważny przedmiot, prosty sposób udzielenia pomocy — możliwość poinformowania właściciela o odnalezieniu zguby.\u003c/p>\n\u003cp>Z czasem zrozumiałem, że ten sam pomysł może być przydatny w wielu innych sytuacjach — wszędzie tam, gdzie fizyczny przedmiot warto powiązać z odpowiednimi informacjami. W tym kierunku chcę dalej rozwijać QR FINDER.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"qr-bottom\">\u003cp>QR FINDER znajduje się na końcowym etapie przygotowań. Oficjalna strona projektu i sklep internetowy nie są jeszcze publicznie dostępne. Datę uruchomienia ogłoszę po jej potwierdzeniu. Pokazane tu metalowe zawieszki są wizualizacjami projektu.\u003c/p>\u003ca class=\"btn btn-dark\" href=\"/pl/contact/?topic=qr\">Zapytania dotyczące QR FINDER \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Autor i eseista mieszkający w Irlandii · Autor projektu książkowego „Kod Przejściowy” · Twórca QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"/pl/contact/\">Kontakt\u003c/a>\u003ca href=\"/pl/privacy.html\">Prywatność\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · Wszelkie prawa zastrzeżone.\u003c/span>\n\u003cspan>Niezależna strona autorska · Nieopublikowane rękopisy wyraźnie oznaczone\u003c/span>\u003c/div>\u003c/footer>\n\u003cscript id=\"qr-tags-mobile-placement\">\n/* On narrow screens, separate the two existing original photos.\n   Desktop keeps the original positions; no image is duplicated. */\n(function () {\n  const intro = document.querySelector('#qr-finder .qr-intro');\n  const tags = document.querySelector('#qr-finder .product-photo');\n  const petExample = document.querySelector('#qr-finder section[aria-labelledby=\"pet-example\"]');\n  if (!intro || !tags || !petExample) return;\n\n  const mobile = window.matchMedia('(max-width: 760px)');\n  function arrangePhotos() {\n    if (mobile.matches) {\n      petExample.after(tags);\n    } else {\n      intro.after(tags);\n    }\n  }\n  arrangePhotos();\n  if (mobile.addEventListener) {\n    mobile.addEventListener('change', arrangePhotos);\n  } else if (mobile.addListener) {\n    mobile.addListener(arrangePhotos);\n  }\n}());\n\u003c/script>\n\u003c/body>\u003c/html>","en|/qr-finder/articles/":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>QR FINDER Articles &amp; Updates | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Selected QR FINDER product updates and published articles.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/qr-finder/articles/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/qr-finder/articles/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/qr-finder/articles/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"QR FINDER Articles &amp; Updates | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Selected QR FINDER product updates and published articles.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/qr-finder/articles/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"../../assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"../../styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"../../v4.css?v=20261117-review-1\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-articles\">\u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — home\" class=\"brand\" href=\"../../\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Main navigation\" class=\"desktop-nav\">\n\u003ca href=\"../../\">Home\u003c/a>\n\u003ca href=\"../../writing/\">Writing &amp; Books\u003c/a>\n\u003ca aria-current=\"page\" href=\"../../qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"../../contact/\">Get in touch \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Language / Język\">\u003ca href=\"https://mariuszgorlowski.com/qr-finder/articles/\" lang=\"en\" hreflang=\"en\" aria-current=\"page\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/qr-finder/articles/\" lang=\"pl\" hreflang=\"pl\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"../../\">\u003cspan aria-hidden=\"true\">←\u003c/span> Back to profile\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>QR FINDER\u003c/h1>\u003cp>Selected articles about the system, its products and development.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"QR FINDER sections\" class=\"v4-tabs\">\u003ca class=\"\" href=\"../../qr-finder/\">System\u003c/a>\u003ca class=\"active\" aria-current=\"page\" href=\"../../qr-finder/articles/\">Articles &amp; Updates\u003c/a>\u003ca class=\"\" href=\"../../contact/?topic=qr\">Contact\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection class=\"paper-card v4-publications\" aria-labelledby=\"articles-title\">\n\u003cdiv class=\"section-label\">Selected project updates\u003c/div>\u003ch2 id=\"articles-title\">Articles &amp; Updates\u003c/h2>\n\u003cp class=\"section-intro\">From the first idea to a working system.\u003c/p>\n\u003cp>A selection of already published articles about the design of QR FINDER, the decisions behind its development and the features that matter in everyday use.\u003c/p>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"v4-article-list\">\u003c!-- AUTO:QR:START -->\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-16\">16 November 2026\u003c/time> · QR FINDER\u003c/div>\n\u003ch3>It All Started with These QR FINDER Tags\u003c/h3>\u003cp>How the first carefully designed metal tags grew into a wider system. Through the example of a free pet profile, I explain the importance of updating information, controlling what is shared and giving finders a simple way to help.\u003c/p>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122104467285546956\" target=\"_blank\" rel=\"noopener noreferrer\">Read on Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca href=\"https://www.linkedin.com/pulse/all-started-qr-finder-tags-mariusz-gorlowski-fgptf/\" target=\"_blank\" rel=\"noopener noreferrer\">Read on LinkedIn \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\n\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-10\">10 November 2026\u003c/time> · QR FINDER\u003c/div>\n\u003ch3>Introducing QR FINDER\u003c/h3>\u003cp>The first public introduction to QR FINDER — the original idea, materials, products and the practical problem the system was created to solve.\u003c/p>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122098581891546956\" target=\"_blank\" rel=\"noopener noreferrer\">Read on Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c!-- AUTO:QR:END -->\u003c/div>\n\u003ca class=\"v4-more\" href=\"https://www.facebook.com/122101706787546956\" target=\"_blank\" rel=\"noopener noreferrer\">More QR FINDER updates on Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Ireland-based writer and essayist · Author of The Transition Code book project · Founder of QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"../../writing/\">Writing &amp; Books\u003c/a>\n\u003ca href=\"../../qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"../../contact/\">Contact\u003c/a>\u003ca href=\"../../privacy.html\">Privacy\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · All rights reserved.\u003c/span>\n\u003cspan>Independent author website · Unpublished manuscripts clearly identified\u003c/span>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","pl|/qr-finder/articles/":"\u003c!doctype html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>Artykuły i aktualności QR FINDER | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Wybrane artykuły i aktualności o produktach i rozwoju QR FINDER.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/pl/qr-finder/articles/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/qr-finder/articles/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/qr-finder/articles/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"Artykuły i aktualności QR FINDER | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Wybrane artykuły i aktualności o produktach i rozwoju QR FINDER.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/pl/qr-finder/articles/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"/assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"/styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"/v4.css?v=20261117-review-1\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-articles\">\u003ca class=\"skip-link\" href=\"#main\">Przejdź do treści\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — strona główna\" class=\"brand\" href=\"/pl/\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Nawigacja główna\" class=\"desktop-nav\">\n\u003ca href=\"/pl/\">Strona główna\u003c/a>\n\u003ca href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca aria-current=\"page\" href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"/pl/contact/\">Napisz do mnie \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Język / Language\">\u003ca href=\"https://mariuszgorlowski.com/qr-finder/articles/\" lang=\"en\" hreflang=\"en\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/qr-finder/articles/\" lang=\"pl\" hreflang=\"pl\" aria-current=\"page\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"/pl/\">\u003cspan aria-hidden=\"true\">←\u003c/span> Wróć do profilu\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>QR FINDER\u003c/h1>\u003cp>Wybrane artykuły o systemie, jego produktach i rozwoju.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"Sekcje QR FINDER\" class=\"v4-tabs\">\u003ca class=\"\" href=\"/pl/qr-finder/\">System\u003c/a>\u003ca class=\"active\" aria-current=\"page\" href=\"/pl/qr-finder/articles/\">Artykuły i aktualności\u003c/a>\u003ca class=\"\" href=\"/pl/contact/?topic=qr\">Kontakt\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection class=\"paper-card v4-publications\" aria-labelledby=\"articles-title\">\n\u003cdiv class=\"section-label\">Wybrane aktualności projektu\u003c/div>\u003ch2 id=\"articles-title\">Artykuły i aktualności\u003c/h2>\n\u003cp class=\"section-intro\">Od pierwszego pomysłu do działającego systemu.\u003c/p>\n\u003cp>Wybór opublikowanych już artykułów o projektowaniu QR FINDER, decyzjach podejmowanych podczas rozwoju systemu i funkcjach przydatnych na co dzień.\u003c/p>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"v4-article-list\">\u003c!-- AUTO:QR:START -->\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-16\">16 listopada 2026\u003c/time> · QR FINDER\u003c/div>\n\u003ch3>Wszystko zaczęło się od zawieszek QR FINDER\u003c/h3>\u003cp>Jak z pierwszych starannie zaprojektowanych metalowych zawieszek powstał większy system. Na przykładzie bezpłatnego profilu zwierzęcia wyjaśniam, dlaczego tak ważne są aktualizacja danych, kontrola udostępnianych informacji i prosty sposób kontaktu ze znalazcą.\u003c/p>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122104467285546956\" target=\"_blank\" rel=\"noopener noreferrer\">Przeczytaj na Facebooku \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca href=\"https://www.linkedin.com/pulse/all-started-qr-finder-tags-mariusz-gorlowski-fgptf/\" target=\"_blank\" rel=\"noopener noreferrer\">Przeczytaj na LinkedIn \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\n\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-10\">10 listopada 2026\u003c/time> · QR FINDER\u003c/div>\n\u003ch3>Przedstawiam QR FINDER\u003c/h3>\u003cp>Pierwszy publiczny artykuł przedstawiający QR FINDER — pomysł, materiały, produkty oraz praktyczny problem, który stał się początkiem projektu.\u003c/p>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122098581891546956\" target=\"_blank\" rel=\"noopener noreferrer\">Przeczytaj na Facebooku \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c!-- AUTO:QR:END -->\u003c/div>\n\u003ca class=\"v4-more\" href=\"https://www.facebook.com/122101706787546956\" target=\"_blank\" rel=\"noopener noreferrer\">Więcej aktualności QR FINDER na Facebooku \u003cspan aria ass=\"v4-content-stack\">\u003csection aria-labelledby=\"contact-title\" class=\"paper-card contact-card\" id=\"contact\">\n\u003cdiv aria-hidden=\"true\" class=\"contact-gold-rule\">\u003c/div>\n\u003cdiv class=\"contact-header\">\n  \u003cdiv>\n    \u003cdiv class=\"section-label\">05 / Contact &amp; proposals\u003c/div>\n    \u003ch2 id=\"contact-title\">Let's talk.\u003c/h2>\n    \u003cp class=\"section-intro\">Are you a literary agent or publisher? Are you commissioning a written essay or article? Have a proposal for a publishing collaboration, or would you like to discuss QR FINDER? Please use the form below. A few clear sentences about your enquiry are enough.\u003c/p>\n  \u003c/div>\n  \u003cdiv aria-hidden=\"true\" class=\"contact-monogram\">\u003cspan>MG\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv aria-label=\"Types of enquiries\" class=\"contact-types\">\u003cspan>Literary agents &amp; publishers\u003c/span>\u003cspan>Essays &amp; written articles\u003c/span>\u003cspan>Publishing collaborations\u003c/span>\u003cspan>QR FINDER enquiries\u003c/span>\u003c/div>\n\u003cdiv class=\"contact-form-shell\">\n  \u003cdiv class=\"contact-form-heading\">\u003cspan class=\"contact-form-eyebrow\">PRIVATE CORRESPONDENCE\u003c/span>\u003cspan aria-hidden=\"true\" class=\"contact-form-decoration\">✦\u003c/span>\u003c/div>\n  \u003ch3>Send an enquiry\u003c/h3>\n  \u003cp class=\"contact-form-explanation\">Tell me a little about your enquiry. Your message will be handled privately; no direct email address is published on this website.\u003c/p>\n  \u003cform action=\"https://formspree.io/f/mdegeqwb\" class=\"contact-form\" id=\"contact-form\" method=\"POST\" name=\"author-contact\">\n    \u003cinput name=\"_subject\" type=\"hidden\" value=\"New enquiry from mariuszgorlowski.com\"/>\n    \u003cp aria-hidden=\"true\" class=\"hidden-bot\">\u003clabel>Leave this field empty \u003cinput autocomplete=\"off\" name=\"_gotcha\" tabindex=\"-1\" type=\"text\"/>\u003c/label>\u003c/p>\n    \u003cdiv class=\"form-grid\">\n      \u003cdiv class=\"field\">\u003clabel for=\"sender-name\">Your name \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003cinput autocomplete=\"name\" id=\"sender-name\" maxlength=\"120\" name=\"name\" placeholder=\"Your full name\" required type=\"text\"/>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"sender-email\">Your email address \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003cinput autocomplete=\"email\" id=\"sender-email\" maxlength=\"200\" name=\"email\" placeholder=\"name@example.com\" required type=\"email\"/>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"subject\">Nature of enquiry \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003cselect id=\"subject\" name=\"subject\" required>\u003coption disabled selected value=\"\">Select an enquiry type\u003c/option>\u003coption value=\"Literary agent / publisher\">Literary agent / publisher\u003c/option>\u003coption value=\"Editorial / written article\">Editorial / written article\u003c/option>\u003coption value=\"QR FINDER / business proposal\">QR FINDER / business proposal\u003c/option>\u003coption value=\"Written collaboration\">Written collaboration\u003c/option>\u003coption value=\"Other enquiry\">Other enquiry\u003c/option>\u003c/select>\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"message\">Your message \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003ctextarea id=\"message\" maxlength=\"5000\" minlength=\"10\" name=\"message\" placeholder=\"Tell me a little about your enquiry or proposal...\" required rows=\"6\">\u003c/textarea>\u003c/div>\n    \u003clabel class=\"consent\">\u003cinput name=\"privacy-consent\" required type=\"checkbox\" value=\"yes\"/>\u003cspan>I agree to my details being used to respond to my enquiry, as described in the \u003ca href=\"../privacy.html\">privacy notice\u003c/a>.\u003c/span>\u003c/label>\n    \u003cdiv class=\"submit-row\">\u003cbutton class=\"contact-send\" type=\"submit\">\u003cspan>Send enquiry\u003c/span>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003cp>Professional enquiries, carefully considered.\u003c/p>\u003c/div>\n    \u003cp aria-live=\"polite\" class=\"preview-notice\" id=\"preview-notice\">\u003c/p>\n  \u003c/form>\n\u003c/div>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Ireland-based writer and essayist · Author of The Transition Code book project · Founder of QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"../writing/\">Writing &amp; Books\u003c/a>\n\u003ca href=\"../qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"../contact/\">Contact\u003c/a>\u003ca href=\"../privacy.html\">Privacy\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · All rights reserved.\u003c/span>\n\u003cspan>Independent author website · Unpublished manuscripts clearly identified\u003c/span>\u003c/div>\u003c/footer>\u003cscript>\n(function(){const v=new URLSearchParams(location.search).get(\"topic\"),select=document.getElementById(\"subject\");\nif(v===\"literary\") select.value=\"Literary agent / publisher\";\nif(v===\"qr\") select.value=\"QR FINDER / business proposal\";\n})();\n\u003c/script>\u003cscript>\n  // Formspree notifications are configured in the owner's private account.\n  // Only the public form ID will be added to the action URL after approval.\n  (function () {\n    const form = document.getElementById('contact-form');\n    if (!form) return;\n    const notice = document.getElementById('preview-notice');\n    const submitButton = form.querySelector('button[type=\"submit\"]');\n\n    form.addEventListener('submit', async function (event) {\n      event.preventDefault();\n      if (!form.action.startsWith('https://formspree.io/f/mdegeqwb') ||\n          !['mariuszgorlowski.com', 'www.mariuszgorlowski.com'].includes(location.hostname)) {\n        notice.textContent = 'Preview only — no enquiry has been sent. The live website keeps the existing Formspree form.';\n        return;\n      }\n\n      if (!form.reportValidity()) return;\n      submitButton.disabled = true;\n      submitButton.setAttribute('aria-busy', 'true');\n      notice.textContent = 'Sending your message…';\n      try {\n        const response = await fetch(form.action, {\n          method: 'POST',\n          body: new FormData(form),\n          headers: { 'Accept': 'application/json' }\n        });\n        if (response.ok) {\n          // A custom Thank You URL is not included in Formspree's Free plan.\n          // AJAX allows us to show our own confirmation page after a real success.\n          window.location.assign(new URL('../thank-you.html', window.location.href).href);\n          return;\n        }\n        if (response.status === 429) {\n          notice.textContent = 'Too many requests right now. Please try again later.';\n        } else if (response.status === 400 || response.status === 422) {\n          notice.textContent = 'Please check the form details and try again.';\n        } else {\n          notice.textContent = 'Your message could not be sent. Please try again later.';\n        }\n      } catch (_) {\n        notice.textContent = 'The connection failed. Please check your internet connection and try again.';\n      } finally {\n        submitButton.disabled = false;\n        submitButton.removeAttribute('aria-busy');\n      }\n    });\n  })();\n\u003c/script>\u003c/body>\u003c/html>","pl|/contact/":"\u003c!doctype html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u PONDENCJA\u003c/span>\u003cspan aria-hidden=\"true\" class=\"contact-form-decoration\">✦\u003c/span>\u003c/div>\n  \u003ch3>Wyślij wiadomość\u003c/h3>\n  \u003cp class=\"contact-form-explanation\">Napisz krótko, czego dotyczy Twoja wiadomość. Korespondencja pozostaje prywatna; na stronie nie publikuję bezpośredniego adresu e-mail.\u003c/p>\n  \u003cform action=\"https://formspree.io/f/mdegeqwb\" class=\"contact-form\" id=\"contact-form\" method=\"POST\" name=\"author-contact\">\n    \u003cinput name=\"_subject\" type=\"hidden\" value=\"New enquiry from mariuszgorlowski.com\"/>\n    \u003cp aria-hidden=\"true\" class=\"hidden-bot\">\u003clabel>Pozostaw to pole puste \u003cinput autocomplete=\"off\" name=\"_gotcha\" tabindex=\"-1\" type=\"text\"/>\u003c/label>\u003c/p>\n    \u003cdiv class=\"form-grid\">\n      \u003cdiv class=\"field\">\u003clabel for=\"sender-name\">Imię i nazwisko \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003cinput autocomplete=\"name\" id=\"sender-name\" maxlength=\"120\" name=\"name\" placeholder=\"Imię i nazwisko\" required type=\"text\"/>\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"sender-email\">Adres e-mail \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003cinput autocomplete=\"email\" id=\"sender-email\" maxlength=\"200\" name=\"email\" placeholder=\"name@example.com\" required type=\"email\"/>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"subject\">Temat wiadomości \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003cselect id=\"subject\" name=\"subject\" required>\u003coption disabled selected value=\"\">Wybierz temat\u003c/option>\u003coption value=\"Literary agent / publisher\">Agent literacki / wydawca\u003c/option>\u003coption value=\"Editorial / written article\">Redakcja / tekst pisany\u003c/option>\u003coption value=\"QR FINDER / business proposal\">QR FINDER / propozycja biznesowa\u003c/option>\u003coption value=\"Written collaboration\">Współpraca pisemna\u003c/option>\u003coption value=\"Other enquiry\">Inna sprawa\u003c/option>\u003c/select>\u003c/div>\n    \u003cdiv class=\"field\">\u003clabel for=\"message\">Treść wiadomości \u003cspan aria-hidden=\"true\">*\u003c/span>\u003c/label>\u003ctextarea id=\"message\" maxlength=\"5000\" minlength=\"10\" name=\"message\" placeholder=\"Napisz krótko, czego dotyczy Twoja wiadomość...\" required rows=\"6\">\u003c/textarea>\u003c/div>\n    \u003clabel class=\"consent\">\u003cinput name=\"privacy-consent\" required type=\"checkbox\" value=\"yes\"/>\u003cspan>Wyrażam zgodę na wykorzystanie moich danych do udzielenia odpowiedzi, zgodnie z \u003ca href=\"/pl/privacy.html\">informacją o prywatności\u003c/a>.\u003c/span>\u003c/label>\n    \u003cdiv class=\"submit-row\">\u003cbutton class=\"contact-send\" type=\"submit\">\u003cspan>Wyślij wiadomość\u003c/span>\u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/button>\u003cp>Ważne wiadomości otrzymują należytą uwagę.\u003c/p>\u003c/div>\n    \u003cp aria-live=\"polite\" class=\"preview-notice\" id=\"preview-notice\">\u003c/p>\n  \u003c/form>\n\u003c/div>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Autor i eseista mieszkający w Irlandii · Autor projektu książkowego „Kod Przejściowy” · Twórca QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"/pl/contact/\">Kontakt\u003c/a>\u003ca href=\"/pl/privacy.html\">Prywatność\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · Wszelkie prawa zastrzeżone.\u003c/span>\n\u003cspan>Niezależna strona autorska · Nieopublikowane rękopisy wyraźnie oznaczone\u003c/span>\u003c/div>\u003c/footer>\u003cscript>\n(function(){const v=new URLSearchParams(location.search).get(\"topic\"),select=document.getElementById(\"subject\");\nif(v===\"literary\") select.value=\"Literary agent / publisher\";\nif(v===\"qr\") select.value=\"QR FINDER / business proposal\";\n})();\n\u003c/script>\u003cscript>\n  // Formspree notifications are configured in the owner's private account.\n  // Only the public form ID will be added to the action URL after approval.\n  (function () {\n    const form = document.getElementById('contact-form');\n    if (!form) return;\n    const notice = document.getElementById('preview-notice');\n    const submitButton = form.querySelector('button[type=\"submit\"]');\n\n    form.addEventListener('submit', async function (event) {\n      event.preventDefault();\n      if (!form.action.startsWith('https://formspree.io/f/mdegeqwb') ||\n          !['mariuszgorlowski.com', 'www.mariuszgorlowski.com'].includes(location.hostname)) {\n        notice.textContent = 'Podgląd — wiadomość nie została wysłana. Formularz działa wyłącznie na oficjalnej stronie.';\n        return;\n      }\n\n      if (!form.reportValidity()) return;\n      submitButton.disabled = true;\n      submitButton.setAttribute('aria-busy', 'true');\n      notice.textContent = 'Wysyłanie wiadomości…';\n      try {\n        const response = await fetch(form.action, {\n          method: 'POST',\n          body: new FormData(form),\n          headers: { 'Accept': 'application/json' }\n        });\n        if (response.ok) {\n          // A custom Thank You URL is not included in Formspree's Free plan.\n          // AJAX allows us to show our own confirmation page after a real success.\n          window.location.assign(new URL('../thank-you.html', window.location.href).href);\n          return;\n        }\n        if (response.status === 429) {\n          notice.textContent = 'Zbyt wiele prób. Spróbuj ponownie później.';\n        } else if (response.status === 400 || response.status === 422) {\n          notice.textContent = 'Sprawdź dane w formularzu i spróbuj ponownie.';\n        } else {\n          notice.textContent = 'Nie udało się wysłać wiadomości. Spróbuj ponownie później.';\n        }\n      } catch (_) {\n        notice.textContent = 'Błąd połączenia. Sprawdź internet i spróbuj ponownie.';\n      } finally {\n        submitButton.disabled = false;\n        submitButton.removeAttribute('aria-busy');\n      }\n    });\n  })();\n\u003c/script>\u003c/body>\u003c/html>","en|/privacy.html":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"robots\" content=\"noindex,follow\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003ctitle>Privacy notice | Mariusz Gorlowski\u003c/title>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/privacy.html\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/privacy.html\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/privacy.html\"/>\n\u003clink rel=\"stylesheet\" href=\"styles.css\"/>\n\u003clink rel=\"icon\" href=\"assets/favicon.svg\" type=\"image/svg+xml\"/>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\u003ca href=\"index.html\" class=\"brand\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\u003cnav class=\"lang-switch\" aria-label=\"Language / Język\">\u003ca href=\"https://mariuszgorlowski.com/privacy.html\" lang=\"en\" hreflang=\"en\" aria-current=\"page\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/privacy.html\" lang=\"pl\" hreflang=\"pl\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\n\u003cmain id=\"main\" class=\"container simple-page\">\u003cdiv class=\"paper-card\">\n\u003cdiv class=\"section-label\">Website information\u003c/div>\n\u003ch1>Privacy notice\u003c/h1>\n\u003cp>Last updated: 16 November 2026. This notice explains how enquiries sent via \u003cstrong>mariuszgorlowski.com\u003c/strong> are handled.\u003c/p>\n\u003ch2>Who is responsible?\u003c/h2>\n\u003cp>Mariusz Gorlowski, based in Ireland, is responsible for the personal information submitted through this author's website. To ask a privacy question or exercise a data protection right, use the \u003ca href=\"contact/\">contact form\u003c/a>.\u003c/p>\n\u003ch2>What information is collected?\u003c/h2>\n\u003cp>If you send an enquiry, the form collects the name, email address, enquiry type and message that you provide. Service providers may also process limited technical information, such as IP address and browser details, to operate the site, deliver the form and prevent abuse. Please do not submit sensitive information unless essential to your enquiry.\u003c/p>\n\u003ch2>Why is it used?\u003c/h2>\n\u003cp>Your information is used to receive, assess and respond to correspondence about writing, publishing, editorial collaborations and business proposals. The legal basis is the legitimate interest in handling enquiries and correspondence; information may also be retained where necessary to comply with legal obligations. Messages are not added to a marketing mailing list and will not be sold.\u003c/p>\n\u003ch2>Who processes the information?\u003c/h2>\n\u003cp>The website is hosted by GitHub Pages and the contact form uses Formspree. The notification email service used by the author may also process messages. These providers process the technical data necessary to provide their services and may process data outside the European Economic Area subject to their applicable contractual and data protection safeguards.\u003c/p>\n\u003ch2>How long is information kept?\u003c/h2>\n\u003cp>Messages are retained only as long as reasonably necessary to respond to and follow up on the enquiry, or longer if an ongoing professional relationship or legal obligation requires it. Correspondence is periodically reviewed, and information no longer needed is deleted.\u003c/p>\n\u003ch2>Your choices and rights\u003c/h2>\n\u003cp>Subject to applicable law, you may ask for access, correction, deletion, restriction or objection to processing of your personal information. Use the \u003ca href=\"contact/\">contact form\u003c/a> for these requests. If you believe your rights have been infringed, you may contact the \u003ca href=\"https://www.dataprotection.ie/\" rel=\"noopener noreferrer\">Irish Data Protection Commission\u003c/a>.\u003c/p>\n\u003ch2>Cookies and analytics\u003c/h2>\n\u003cp>This website does not intentionally use advertising trackers, newsletter subscriptions or third-party analytics cookies. Hosting and form providers may use strictly necessary technical measures to deliver and secure their services. This notice will be updated if additional tracking or services are introduced.\u003c/p>\n\u003cp>\u003ca class=\"btn btn-outline\" href=\"contact/\">Back to contact\u003c/a>\u003c/p>\n\u003c/div>\u003c/main>\n\u003c/body>\u003c/html>\n","pl|/privacy.html":"\u003c!doctype html>\n\u003chtml lang=\"pl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"robots\" content=\"noindex,follow\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003ctitle>Informacja o prywatności | Mariusz Gorlowski\u003c/title>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/pl/privacy.html\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/privacy.html\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/privacy.html\"/>\n\u003clink rel=\"stylesheet\" href=\"/styles.css\"/>\n\u003clink rel=\"icon\" href=\"/assets/favicon.svg\" type=\"image/svg+xml\"/>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip-link\" href=\"#main\">Przejdź do treści\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\u003ca href=\"/pl/index.html\" class=\"brand\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\u003cnav class=\"lang-switch\" aria-label=\"Język / Language\">\u003ca href=\"https://mariuszgorlowski.com/privacy.html\" lang=\"en\" hreflang=\"en\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/privacy.html\" lang=\"pl\" hreflang=\"pl\" aria-current=\"page\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\n\u003cmain id=\"main\" class=\"container simple-page\">\u003cdiv class=\"paper-card\">\n\u003cdiv class=\"section-label\">Informacje o stronie\u003c/div>\n\u003ch1>Informacja o prywatności\u003c/h1>\n\u003cp>Ostatnia aktualizacja: 16 listopada 2026 r. Niniejsza informacja wyjaśnia, w jaki sposób obsługiwane są wiadomości wysyłane za pośrednictwem \u003cstrong>mariuszgorlowski.com\u003c/strong>.\u003c/p>\n\u003ch2>Kto odpowiada za przetwarzanie danych?\u003c/h2>\n\u003cp>Mariusz Gorlowski, mieszkający w Irlandii, odpowiada za dane osobowe przekazywane za pośrednictwem tej strony autorskiej. Pytania dotyczące prywatności i wnioski związane z ochroną danych można przesyłać przez \u003ca href=\"/pl/contact/\">formularz kontaktowy\u003c/a>.\u003c/p>\n\u003ch2>Jakie dane są zbierane?\u003c/h2>\n\u003cp>Jeżeli wyślesz wiadomość, formularz zbierze podane przez Ciebie imię i nazwisko, adres e-mail, rodzaj zapytania oraz jego treść. Dostawcy usług mogą również przetwarzać ograniczone dane techniczne, takie jak adres IP i informacje o przeglądarce, w celu działania strony i formularza oraz zapobiegania nadużyciom. Nie przesyłaj danych wrażliwych, chyba że są niezbędne w danej sprawie.\u003c/p>\n\u003ch2>W jakim celu wykorzystywane są dane?\u003c/h2>\n\u003cp>Dane są wykorzystywane do odbierania, rozpatrywania i obsługi korespondencji dotyczącej twórczości, publikacji, współpracy redakcyjnej i propozycji biznesowych. Podstawą prawną jest prawnie uzasadniony interes polegający na prowadzeniu korespondencji; dane mogą być również przechowywane, jeśli wymagają tego obowiązki prawne. Wiadomości nie są dodawane do marketingowej listy mailingowej, a dane nie będą sprzedawane.\u003c/p>\n\u003ch2>Kto przetwarza dane?\u003c/h2>\n\u003cp>Strona jest hostowana w GitHub Pages, a formularz kontaktowy korzysta z Formspree. Dane z wiadomości może również przetwarzać dostawca poczty elektronicznej używanej przez autora. Dostawcy ci przetwarzają informacje techniczne niezbędne do świadczenia usług i mogą przekazywać dane poza Europejski Obszar Gospodarczy, z zastosowaniem odpowiednich zabezpieczeń umownych i ochrony danych.\u003c/p>\n\u003ch2>Jak długo przechowywane są dane?\u003c/h2>\n\u003cp>Wiadomości są przechowywane wyłącznie tak długo, jak jest to rozsądnie niezbędne do odpowiedzi i dalszej obsługi sprawy, chyba że trwająca współpraca zawodowa lub obowiązek prawny wymaga dłuższego przechowywania. Korespondencja jest okresowo przeglądana, a zbędne dane są usuwane.\u003c/p>\n\u003ch2>Twoje wybory i prawa\u003c/h2>\n\u003cp>Zgodnie z obowiązującymi przepisami możesz żądać dostępu do danych, ich poprawienia, usunięcia, ograniczenia przetwarzania lub wnieść sprzeciw wobec przetwarzania. Skorzystaj z \u003ca href=\"/pl/contact/\">formularz kontaktowy\u003c/a> w tych sprawach. Jeśli uważasz, że Twoje prawa zostały naruszone, możesz skontaktować się z \u003ca href=\"https://www.dataprotection.ie/\" rel=\"noopener noreferrer\">irlandzką Komisją Ochrony Danych (Data Protection Commission)\u003c/a>.\u003c/p>\n\u003ch2>Pliki cookie i analityka\u003c/h2>\n\u003cp>Strona nie używa celowo narzędzi śledzących do reklam, subskrypcji newslettera ani analitycznych plików cookie podmiotów trzecich. Dostawcy hostingu i formularza mogą stosować ściśle niezbędne rozwiązania techniczne służące do działania i zabezpieczenia usług. Informacja zostanie zaktualizowana w razie wprowadzenia dodatkowych narzędzi lub usług.\u003c/p>\n\u003cp>\u003ca class=\"btn btn-outline\" href=\"/pl/contact/\">Wróć do kontaktu\u003c/a>\u003c/p>\n\u003c/div>\u003c/main>\n\u003c/body>\u003c/html>\n","en|/thank-you.html":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Thank you | Mariusz Gorlowski\u003c/title>\u003cmeta name=\"robots\" content=\"noindex\">\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/thank-you.html\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/thank-you.html\"/>\u003clink rel=\"stylesheet\" href=\"styles.css\">\u003clink rel=\"icon\" href=\"assets/favicon.svg\" type=\"image/svg+xml\">\u003c/head>\u003cbody>\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\u003ca href=\"index.html\" class=\"brand\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\u003cnav class=\"lang-switch\" aria-label=\"Language / Język\">\u003ca href=\"https://mariuszgorlowski.com/thank-you.html\" lang=\"en\" hreflang=\"en\" aria-current=\"page\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/thank-you.html\" lang=\"pl\" hreflang=\"pl\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain class=\"container simple-page\">\u003cdiv class=\"paper-card\">\u003cdiv class=\"section-label\">Message received\u003c/div>\u003ch1>Thank you for getting in touch.\u003c/h1>\u003cp>Your enquiry has been submitted. I will review it and respond if a reply is appropriate.\u003c/p>\u003ca class=\"btn btn-dark\" href=\"index.html\">Return to homepage \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/ma <script>
(()=>{"use strict";
const DATA=JSON.parse(document.getElementById("website-data").textContent);
const IMAGES=JSON.parse(document.getElementById("asset-data").textContent);
const ROUTES=["/","/writing/","/writing/essays/","/qr-finder/","/qr-finder/articles/","/contact/","/privacy.html","/thank-you.html"],ORIGIN="https://mariuszgorlowski.com",frame=document.getElementById("site");
let active={lang:"pl",route:"/"},seq=0,observer=null;
const get=()=>{const a=location.hash.slice(1).split("|");return{lang:a[0]==="en"?"en":"pl",route:ROUTES.includes(a[1])?a[1]:"/"};};
const paint=()=>{document.querySelectorAll("[data-route]").forEach(b=>b.setAttribute("aria-current",b.dataset.route===active.route?"page":"false"));document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-current",b.dataset.lang===active.lang?"page":"false"));};
function goto(lang,route,fragment){const hash="#"+lang+"|"+route;if(location.hash!==hash){location.hash=hash;}else{render(fragment);}}
function match(url){if(url.origin!==ORIGIN)return null;let path=url.pathname,lang="en";if(path==="/pl"||path.startsWith("/pl/")){lang="pl";path=path.slice(3)||"/";}return ROUTES.includes(path)?{lang,route:path,fragment:url.hash}:null;}
function picture(url){try{const path=new URL(url,ORIGIN).pathname;return IMAGES[path]||null;}catch{return null;}}
function render(fragment){
 const ticket=++seq;active=get();paint();const html=DATA.pages[active.lang+"|"+active.route];if(!html)return;
 const doc=new DOMParser().parseFromString(html,"text/html");
 doc.querySelectorAll("script,link[rel=stylesheet]").forEach(x=>x.remove());
 const base=doc.createElement("base");base.href=ORIGIN+(active.lang==="pl"?"/pl":"")+active.route;doc.head.prepend(base);
 const style=doc.createElement("style");style.textContent=DATA.styles;doc.head.appendChild(style);
 doc.querySelectorAll("img[src],link[rel=icon],a[href]").forEach(el=>{
  const key=el.hasAttribute("src")?"src":"href";const replacement=picture(el.getAttribute(key));
  if(replacement)el.setAttribute(key,replacement);
 });
 const form=doc.getElementById("contact-form");
 if(form){form.removeAttribute("action");const btn=form.querySelector('button[type="submit"]');if(btn){btn.disabled=true;btn.textContent=active.lang==="pl"?"Podgląd — brak wysyłki":"Preview — sending disabled";}
 const n=doc.createElement("p");n.textContent=active.lang==="pl"?"Podgląd demonstracyjny. Nie można wysłać wiadomości.":"Demonstration only. Form submission disabled.";n.style.cssText="margin:10px 0;color:#c9ab73;font-weight:700";form.appendChild(n);}
 frame.onload=()=>{
  if(ticket!==seq)return;const inner=frame.contentDocument;if(!inner)return;
  if(observer)observer.disconnect();
  const resize=()=>{frame.style.height=Math.max(inner.body.scrollHeight,inner.documentElement.scrollHeight,700)+10+"px";};
  observer=new ResizeObserver(resize);observer.observe(inner.body);
  inner.addEventListener("click",ev=>{
   const a=ev.target.closest&&ev.target.closest("a[href]");if(!a)return;
   const href=a.getAttribute("href");if(href.startsWith("data:")){ev.preventDefault();return;}
   const to=match(new URL(href,inner.baseURI));if(to){ev.preventDefault();goto(to.lang,to.route,to.fragment);}
  },true);
  inner.addEventListener("submit",ev=>{ev.preventDefault();ev.stopPropagation();},true);
  const photo=inner.querySelector(".v4-system .product-photo"),pet=inner.querySelector("#pet-example");if(photo&&pet&&frame.clientWidth<=760)pet.after(photo);
  resize();if(fragment){const dest=inner.querySelector(fragment);if(dest)dest.scrollIntoView();}else window.scrollTo(0,0);
 };
