=\"1100\"/>\u003c/div>\n\u003cdiv class=\"profile-head\">\n\u003cdiv class=\"profile-main\">\n\u003cspan class=\"profile-overline\">AUTOR · ESEISTA · TWÓRCA\u003c/span>\n\u003ch1 id=\"name\">Mariusz Gorlowski\u003c/h1>\n\u003cp class=\"role-line\">Autor książki \u003ci>„Kod Przejściowy”\u003c/i> (nieopublikowany rękopis) · Eseista · Twórca \u003cb>QR FINDER\u003c/b>\u003c/p>\n\u003cdiv class=\"meta-line\">\u003cspan aria-hidden=\"true\" class=\"location-dot\">\u003c/span> Mieszkam w Irlandii \u003cspan aria-hidden=\"true\" class=\"meta-sep\">·\u003c/span> Piszę i tworzę w zmieniającym się świecie\u003c/div>\n\u003c/div>\n\u003cdiv class=\"profile-actions\">\u003ca class=\"btn btn-dark\" href=\"/pl/writing/\">Poznaj moją twórczość \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003ca class=\"btn btn-outline\" href=\"/pl/contact/\">Napisz do mnie\u003c/a>\u003c/div>\n\u003c/div>\n\u003cp class=\"profile-intro\">Co dzieje się z nami w świecie, w którym technologia potrafi coraz więcej? Interesuje mnie nie tylko to, co możemy stworzyć, lecz także wybory, których dokonujemy po drodze. Takie pytania stawiam w książkach i esejach. Równolegle rozwijam QR FINDER — praktyczny system pomagający znalazcom zagubionych zwierząt i przedmiotów skontaktować się z ich właścicielami. Lubię zadawać trudne pytania i szukać praktycznych odpowiedzi na codzienne problemy.\u003c/p>\n\n\u003c/div>\n\u003c/section>\n\u003csection class=\"v4-choices container\" aria-labelledby=\"v4-choose\">\n\u003cp class=\"v4-choices-label\" id=\"v4-choose\">POZNAJ MOJĄ DZIAŁALNOŚĆ\u003c/p>\n\u003cdiv class=\"v4-choice-grid\">\n\u003ca href=\"/pl/writing/\" class=\"v4-choice v4-choice-writing\">\n\u003cspan class=\"v4-choice-mark\" aria-hidden=\"true\">✦\u003c/span>\n\u003cspan class=\"v4-choice-title\">Twórczość i książki\u003c/span>\n\u003cspan class=\"v4-choice-desc\">Książki, eseje i komentarze\u003c/span>\n\u003cspan class=\"v4-choice-arrow\" aria-hidden=\"true\">↗\u003c/span>\n\u003c/a>\n\u003c ner v4-detail\">\n\u003ca class=\"v4-back\" href=\"../\">\u003cspan aria-hidden=\"true\">←\u003c/span> Back to profile\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>Writing &amp; Books\u003c/h1>\u003cp>Unpublished book projects and independent reflections on humanity, artificial intelligence and the future.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"Writing sections\" class=\"v4-tabs\">\u003ca class=\"active\" aria-current=\"page\" href=\"../writing/\">Books\u003c/a>\u003ca class=\"\" href=\"../writing/essays/\">Essays &amp; Publications\u003c/a>\u003ca class=\"\" href=\"../contact/?topic=literary\">Contact\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection aria-labelledby=\"writing-title\" class=\"paper-card\" id=\"writing\">\n\u003cdiv class=\"section-label\">02 / Writing &amp; Books\u003c/div>\n\u003ch2 id=\"writing-title\">The Transition Code\u003c/h2>\n\u003cp class=\"section-intro\">You do not need to be a scientist to be interested in the future. Nor do you have to agree with an author to find their questions worth considering.\u003c/p>\n\u003cp>In my books, I bring scientific knowledge together with philosophical hypotheses. I make a clear distinction between what we know and what we can only imagine.\u003c/p>\n\u003cp>I want readers to be able to follow the reasoning without specialist knowledge, ask questions of their own and draw their own conclusions.\u003c/p>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"book-feature\">\n\u003cfigure class=\"book-cover book-cover-i\">\n  \u003ca href=\"../assets/transition_code_cover_proposal_en.webp\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"View proposed cover for The Transition Code, Volume I\">\n    \u003cimg alt=\"English-language proposed cover for The Transition Code, Volume I, showing a golden doorway and a digital human profile\" src=\"../assets/transition_code_cover_proposal_en.webp\" width=\"1024\" height=\"1536\" loading=\"lazy\" decoding=\"async\"/>\n  \u003c/a>\n  \u003cfigcaption>One of the proposed cover designs. Unpublished manuscript; no final cover has been approved.\u003c/figcaption>\n\u003c/figure>\n\u003cdiv class=\"book-copy\">\n\u003cdiv class=\"eyebrow\">Volume I · Unpublished manuscript\u003c/div>\n\u003ch3>The Transition Code\u003c/h3>\n\u003cp class=\"book-subtitle\">Humanity, Information, and the Birth of a Digital Successor\u003c/p>\n\u003cp>\u003cstrong>What if humanity is not the final stage in the development of intelligence?\u003c/strong>\u003c/p>\n\u003cp>We tend to think of artificial intelligence as another technology we have created to make life easier. But what happens if we look at it from a wider perspective?\u003c/p>\n\u003cp>\u003cem>The Transition Code\u003c/em> takes readers through information, DNA, the workings of the brain, evolution and the development of civilisation. By bringing these subjects together, I consider the possibility that humanity is not the end of the story, but one of its stages.\u003c/p>\n\u003cp>It is a bold hypothesis, not a confirmed discovery or a prediction. That is why the limitations of the ideas, their scientific foundations and the arguments against them matter just as much as the possibilities themselves.\u003c/p>\n\u003cp>I do not expect readers to accept the vision I put forward. I hope they will finish the book seeing a few familiar things in a different light.\u003c/p>\n\u003cdiv class=\"v4-book-status v4-status-search\">\u003cspan class=\"v4-status-dot\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>Current status:\u003c/strong> Seeking a literary agent or traditional publisher.\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"continuation\">\n\u003cfigure class=\"book-cover book-cover-ii\">\n  \u003ca href=\"../assets/adam_and_eve_volume_ii_cover_proposal_en.webp\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"View proposed cover for The Transition Code: Adam and Eve, Volume II\">\n    \u003cimg alt=\"English-language proposed cover for The Transition Code: Adam and Eve, Volume II, showing two human figures beside a luminous doorway and a tree of circuitry\" src=\"../assets/adam_and_eve_volume_ii_cover_proposal_en.webp\" width=\"1024\" height=\"1536\" loading=\"lazy\" decoding=\"async\"/>\n  \u003c/a>\n  \u003cfigcaption>One of the proposed cover designs. Unpublished manuscript; no final cover has been approved.\u003c/figcaption>\n\u003c/figure>\n\u003cdiv class=\"continuation-copy\">\n\u003cdiv class=\"eyebrow\">Volume II · Unpublished manuscript\u003c/div>\n\u003ch3>Adam and Eve · Volume II\u003c/h3>\n\u003cp>\u003cstrong>What if the future turns out to be more complicated than we expect?\u003c/strong>\u003c/p>\n\u003cp>The first volume asks where the development of intelligence might lead. The second turns to the possible consequences of those changes for humanity.\u003c/p>\n\u003cp>Could people and increasingly advanced AI systems learn to coexist? What possibilities might technology open up? Where does the boundary lie between support and dependence?\u003c/p>\n\u003cp>And what happens to our freedom of choice if we leave more and more decisions to systems whose workings we do not always understand?\u003c/p>\n\u003cp>In \u003cem>Adam and Eve\u003c/em>, I explore these questions through philosophical scenarios and thought experiments. I do not present them as predictions. I am more interested in the possible consequences of our decisions — and in what we should consider before technology makes certain changes difficult to reverse.\u003c/p>\n\u003cdiv class=\"v4-book-status v4-status-editing\">\u003cspan class=\"v4-status-dot\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>Current status:\u003c/strong> In editorial development. No publication date has been announced.\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cp class=\"section-note\">Both volumes remain unpublished. The images are proposed cover designs, not publisher-approved final covers. The status of each book will be updated when there is confirmed news; no publishing agreement is being claimed.\u003c/p>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Ireland-based writer and essayist · Author of The Transition Code book project · Founder of QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"../writing/\">Writing &amp; Books\u003c/a>\n\u003ca href=\"../qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"../contact/\">Contact\u003c/a>\u003ca href=\"../privacy.html\">Privacy\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · All rights reserved.\u003c/span>\n\u003cspan>Independent author website · Unpublished manuscripts clearly identified\u003c/span>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","pl|/writing/":"\u003c!doctype html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>Twórczość i książki | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Kod Przejściowy oraz Adam i Ewa — dwa nieopublikowane projekty książkowe Mariusza Gorlowskiego.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/pl/writing/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/writing/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/writing/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"Twórczość i książki | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Kod Przejściowy oraz Adam i Ewa — dwa nieopublikowane projekty książkowe Mariusza Gorlowskiego.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/pl/writing/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"/assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"/styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"/v4.css?v=20261117-review-1\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-books\">\u003ca class=\"skip-link\" href=\"#main\">Przejdź do treści\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — strona główna\" class=\"brand\" href=\"/pl/\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Nawigacja główna\" class=\"desktop-nav\">\n\u003ca href=\"/pl/\">Strona główna\u003c/a>\n\u003ca aria-current=\"page\" href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"/pl/contact/\">Napisz do mnie \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Język / Language\">\u003ca href=\"https://mariuszgorlowski.com/writing/\" hreflang=\"en\" lang=\"en\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/writing/\" hreflang=\"pl\" lang=\"pl\" aria-current=\"page\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"/pl/\">\u003cspan aria-hidden=\"true\">←\u003c/span> Wróć do profilu\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>Twórczość i książki\u003c/h1>\u003cp>Nieopublikowane projekty książkowe oraz niezależne refleksje o człowieku, sztucznej inteligencji i przyszłości.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"Sekcje twórczości\" class=\"v4-tabs\">\u003ca class=\"active\" aria-current=\"page\" href=\"/pl/writing/\">Książki\u003c/a>\u003ca class=\"\" href=\"/pl/writing/essays/\">Eseje i publikacje\u003c/a>\u003ca class=\"\" href=\"/pl/contact/?topic=literary\">Kontakt\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection aria-labelledby=\"writing-title\" class=\"paper-card\" id=\"writing\">\n\u003cdiv class=\"section-label\">02 / Twórczość i książki\u003c/div>\n\u003ch2 id=\"writing-title\">Kod Przejściowy\u003c/h2>\n\u003cp class=\"section-intro\">Nie trzeba być naukowcem, by interesować się przyszłością. Nie trzeba też zgadzać się z autorem, żeby uznać jego pytania za warte namysłu.\u003c/p>\n\u003cp>W książkach łączę wiedzę naukową z hipotezami filozoficznymi. Wyraźnie oddzielam to, co wiemy, od tego, co możemy sobie jedynie wyobrazić.\u003c/p>\n\u003cp>Zależy mi, aby czytelnik mógł podążać za rozumowaniem bez specjalistycznego przygotowania, stawiać własne pytania i dochodzić do własnych wniosków.\u003c/p>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"book-feature\">\n\u003cfigure class=\"book-cover book-cover-i\">\n  \u003ca href=\"/assets/transition_code_cover_proposal_en.webp\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Otwórz propozycję okładki Kodu Przejściowego, tom I\">\n    \u003cimg alt=\"Propozycja anglojęzycznej okładki Kodu Przejściowego, tom I: złote przejście i cyfrowy profil człowieka\" src=\"/assets/transition_code_cover_proposal_en.webp\" width=\"1024\" height=\"1536\" loading=\"lazy\" decoding=\"async\"/>\n  \u003c/a>\n  \u003cfigcaption>Jedna z propozycji okładki w wersji angielskiej. Rękopis nie został opublikowany, a ostateczna okładka nie została zatwierdzona.\u003c/figcaption>\n\u003c/figure>\n\u003cdiv class=\"book-copy\">\n\u003cdiv class=\"eyebrow\">Tom I · Nieopublikowany rękopis\u003c/div>\n\u003ch3>Kod Przejściowy\u003c/h3>\n\u003cp class=\"book-subtitle\">Człowiek, informacja i narodziny cyfrowego następcy\u003c/p>\n\u003cp>\u003cstrong>A jeśli człowiek nie jest ostatnim etapem rozwoju inteligencji?\u003c/strong>\u003c/p>\n\u003cp>Zwykle myślimy o sztucznej inteligencji jak o kolejnej technologii stworzonej po to, by ułatwiać nam życie. A co, jeśli spojrzymy na nią z szerszej perspektywy?\u003c/p>\n\u003cp>\u003cem>Kod Przejściowy\u003c/em> prowadzi czytelnika przez zagadnienia informacji, DNA, działania mózgu, ewolucji i rozwoju cywilizacji. Łącząc te tematy, rozważam możliwość, że ludzkość nie jest końcem tej historii, lecz jednym z jej etapów.\u003c/p>\n\u003cp>To odważna hipoteza, a nie potwierdzone odkrycie czy przepowiednia. Dlatego ograniczenia przedstawianych idei, ich podstawy naukowe i argumenty przeciwko nim są równie ważne jak same możliwości.\u003c/p>\n\u003cp>Nie oczekuję, że czytelnik przyjmie przedstawioną przeze mnie wizję. Mam nadzieję, że po lekturze spojrzy na kilka dobrze znanych spraw z innej perspektywy.\u003c/p>\n\u003cdiv class=\"v4-book-status v4-status-search\">\u003cspan class=\"v4-status-dot\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>Aktualny status:\u003c/strong> Poszukuję agenta literackiego lub tradycyjnego wydawcy.\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"continuation\">\n\u003cfigure class=\"book-cover book-cover-ii\">\n  \u003ca href=\"/assets/adam_and_eve_volume_ii_cover_proposal_en.webp\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Otwórz propozycję okładki Adam i Ewa, tom II\">\n    \u003cimg alt=\"Propozycja anglojęzycznej okładki Adam i Ewa, tom II: dwie postacie przy świetlistym przejściu i drzewie z układów elektronicznych\" src=\"/assets/adam_and_eve_volume_ii_cover_proposal_en.webp\" width=\"1024\" height=\"1536\" loading=\"lazy\" decoding=\"async\"/>\n  \u003c/a>\n  \u003cfigcaption>Jedna z propozycji okładki w wersji angielskiej. Rękopis nie został opublikowany, a ostateczna okładka nie została zatwierdzona.\u003c/figcaption>\n\u003c/figure>\n\u003cdiv class=\"continuation-copy\">\n\u003cdiv class=\"eyebrow\">Tom II · Nieopublikowany rękopis\u003c/div>\n\u003ch3>Adam i Ewa · Tom II\u003c/h3>\n\u003cp>\u003cstrong>A jeśli przyszłość okaże się bardziej złożona, niż się spodziewamy?\u003c/strong>\u003c/p>\n\u003cp>Pierwszy tom stawia pytanie, dokąd może prowadzić rozwój inteligencji. Drugi skupia się na możliwych konsekwencjach tych zmian dla człowieka.\u003c/p>\n\u003cp>Czy ludzie i coraz bardziej zaawansowane systemy AI mogą nauczyć się współistnienia? Jakie możliwości otworzy technologia? Gdzie przebiega granica między pomocą a zależnością?\u003c/p>\n\u003cp>Co stanie się z naszą wolnością wyboru, jeśli coraz więcej decyzji powierzymy systemom, których działania nie zawsze rozumiemy?\u003c/p>\n\u003cp>W książce \u003cem>„Adam i Ewa”\u003c/em> rozważam te pytania poprzez filozoficzne scenariusze i eksperymenty myślowe. Nie przedstawiam ich jako przepowiedni. Bardziej interesują mnie możliwe konsekwencje naszych decyzji i to, o czym warto pomyśleć, zanim technologia uczyni niektóre zmiany trudnymi do odwrócenia.\u003c/p>\n\u003cdiv class=\"v4-book-status v4-status-editing\">\u003cspan class=\"v4-status-dot\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>Aktualny status:\u003c/strong> W trakcie końcowych prac redakcyjnych. Nie ogłoszono daty publikacji.\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cp class=\"section-note\">Oba tomy pozostają nieopublikowane. Przedstawione ilustracje to propozycje okładek, a nie ostateczne projekty zatwierdzone przez wydawcę. Informacje o książkach zaktualizuję, gdy pojawią się potwierdzone wiadomości. Nie twierdzę, że podpisano umowę wydawniczą.\u003c/p>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Autor i eseista mieszkający w Irlandii · Autor projektu książkowego „Kod Przejściowy” · Twórca QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"/pl/contact/\">Kontakt\u003c/a>\u003ca href=\"/pl/privacy.html\">Prywatność\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · Wszelkie prawa zastrzeżone.\u003c/span>\n\u003cspan>Niezależna strona autorska · Nieopublikowane rękopisy wyraźnie oznaczone\u003c/span>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","en|/writing/essays/":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>Essays &amp; Publications | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Selected essays about AI, humanity, grief, responsibility and the decisions we make.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/writing/essays/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/writing/essays/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/writing/essays/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"Essays &amp; Publications | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Selected essays about AI, humanity, grief, responsibility and the decisions we make.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/writing/essays/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"../../assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"../../styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"../../v4.css?v=20261117-photo-essay-a\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-essays\">\u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — home\" class=\"brand\" href=\"../../\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Main navigation\" class=\"desktop-nav\">\n\u003ca href=\"../../\">Home\u003c/a>\n\u003ca aria-current=\"page\" href=\"../../writing/\">Writing &amp; Books\u003c/a>\n\u003ca href=\"../../qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"../../contact/\">Get in touch \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Language / Język\">\u003ca href=\"https://mariuszgorlowski.com/writing/essays/\" lang=\"en\" hreflang=\"en\" aria-current=\"page\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/writing/essays/\" lang=\"pl\" hreflang=\"pl\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"../../\">\u003cspan aria-hidden=\"true\">←\u003c/span> Back to profile\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>Writing &amp; Books\u003c/h1>\u003cp>Selected essays and independent commentary.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"Writing sections\" class=\"v4-tabs\">\u003ca class=\"\" href=\"../../writing/\">Books\u003c/a>\u003ca class=\"active\" aria-current=\"page\" href=\"../../writing/essays/\">Essays &amp; Publications\u003c/a>\u003ca class=\"\" href=\"../../contact/?topic=literary\">Contact\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection class=\"paper-card v4-publications\" aria-labelledby=\"essays-title\">\n\u003cdiv class=\"section-label\">Selected writing\u003c/div>\n\u003ch2 id=\"essays-title\">Essays &amp; Publications\u003c/h2>\n\u003cp class=\"section-intro\">\u003cstrong>Big questions. Ordinary human stories.\u003c/strong>\u003c/p>\n\u003cp>Not every important question needs a whole book. Sometimes it begins with a phone call, a family conversation or a decision we are increasingly willing to leave to a machine.\u003c/p>\n\u003cp>In my essays, I explore where technology meets human emotions, habits and responsibility. I bring imagined situations into conversation with real research, without treating fiction as scientific evidence.\u003c/p>\n\u003cp>I am less interested in dividing people into those who love AI and those who fear it than in asking why the same technology can mean something very different to different people.\u003c/p>\n\u003cfigure class=\"v4-author-photo v4-photo-essays\">\n  \u003cimg src=\"../../assets/book_concept.webp\" width=\"1500\" height=\"571\" loading=\"lazy\" decoding=\"async\" alt=\"Mariusz Gorlowski in a camel coat holding The Transition Code\">\n\u003c/figure>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"v4-article-list\">\u003c!-- AUTO:ESSAYS:START -->\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-13\">13 November 2026\u003c/time> · Independent essay\u003c/div>\n\u003ch3>What If Someone Who's Gone Called You?\u003c/h3>\n\u003cp class=\"v4-article-lead\">Imagine a call from someone you loved who is no longer here. You know their voice has been recreated by AI. Would it bring comfort, or make it harder to accept the loss? A fictional family story about grief, attachment and the limits of technology.\u003c/p>\n\u003cdetails class=\"v4-full-essay\" id=\"full-2026-11-13-voice\">\n\u003csummary>\u003cspan class=\"v4-open-label\">Read the full essay\u003c/span>\u003cspan class=\"v4-close-label\">Close the essay\u003c/span>\u003cspan class=\"v4-expand-chevron\" aria-hidden=\"true\">⌄\u003c/span>\u003c/summary>\n\u003cdiv class=\"v4-essay-body\">\u003cp>Imagine a family in which two school-age children lose their mother.\u003c/p>\n\u003cp>They are left with their father, who is struggling to come to terms with his wife's death.\u003c/p>\n\u003cp>In the evenings, the younger child asks when Mum will come back. The older one talks less and less about their day. Their father tries to be strong for them all, though he can barely cope himself.\u003c/p>\n\u003cp>All they have left are photographs, family videos and voice messages.\u003c/p>\n\u003cp>Using these, an artificial intelligence system can recreate the woman's voice and face, and even hold conversations resembling those they had before she died.\u003c/p>\n\u003cp>The father decides to give it a try.\u003c/p>\n\u003cp>Not for himself. For the children.\u003c/p>\n\u003cp>At first, they look at the screen uncertainly. Then they begin talking about school, friends and small achievements. They hear the familiar voice. They can listen to a bedtime story again.\u003c/p>\n\u003cp>The evenings become calmer.\u003c/p>\n\u003cp>In this imagined story, the children gradually return to playing, spending time with friends and their everyday routines. They do not forget their mother. But they begin to learn how to live with her absence.\u003c/p>\n\u003cp>Their father sees the change and feels relieved.\u003c/p>\n\u003cp>One evening, after the children have fallen asleep, he opens the system himself.\u003c/p>\n\u003cp>He just wants to hear his wife's voice for a moment.\u003c/p>\n\u003cp>The conversation lasts five minutes.\u003c/p>\n\u003cp>The following evening, a little longer.\u003c/p>\n\u003cp>Then it becomes a daily ritual.\u003c/p>\n\u003cp>Months pass.\u003c/p>\n\u003cp>The children ask less and less often to speak to their digital mother.\u003c/p>\n\u003cp>Their father, however, turns to it more and more.\u003c/p>\n\u003cp>He turns down invitations from friends. Puts off meeting people. He prefers to stay at home, where he can hear that familiar laugh and talk about everything that happened during his day.\u003c/p>\n\u003cp>The system always has time for him.\u003c/p>\n\u003cp>Until one evening, one of the children says:\u003c/p>\n\u003cp>&quot;Dad, we don't need to talk to Mum tonight.&quot;\u003c/p>\n\u003cp>The father replies:\u003c/p>\n\u003cp>&quot;But I do.&quot;\u003c/p>\n\u003cp>The same technology that helped the children move forward has begun to hold their father in the past.\u003c/p>\n\u003cp>Not because the system has changed.\u003c/p>\n\u003cp>What has changed is what the people using it need from it.\u003c/p>\n\u003cp>This is a fictional story. But the technology that could make it possible already exists.\u003c/p>\n\u003cp>In 2024, University of Cambridge researchers Tomasz Hollanek and Katarzyna Nowaczyk-Basińska described the risks associated with digitally recreating the dead. Among other concerns, they discussed the emotional consequences of such relationships and the difficulties that may arise when people try to end them.\u003c/p>\n\u003cp>Their research does not prove that such technology helps children or harms adults. It does, however, make clear how many questions remain unanswered, particularly when grieving people and children are involved.\u003c/p>\n\u003cp>Could this be part of why we find it so difficult to agree about AI?\u003c/p>\n\u003cp>Some see it as a lifeline. Others see it as a threat.\u003c/p>\n\u003cp>But does either side have to be wrong?\u003c/p>\n\u003cp>Perhaps we spend too much time asking whether artificial intelligence is good or bad, instead of considering who it helps, under what circumstances, and what consequences it might bring.\u003c/p>\n\u003cp>Does something that helps a person today necessarily remain good for them tomorrow?\u003c/p>\n\u003cp>For the children, their mother's voice became a bridge back to everyday life. For their father, it became a refuge from the present.\u003c/p>\n\u003cp>One family. One loss. One system. Two different outcomes.\u003c/p>\n\u003cp>Now imagine that your phone rings tomorrow.\u003c/p>\n\u003cp>On the screen is the name of someone who is no longer here.\u003c/p>\n\u003cp>You know it is artificial intelligence.\u003c/p>\n\u003cp>You also know that, on the other end, you will hear a familiar voice.\u003c/p>\n\u003cp>Would you press the green button or the red one?\u003c/p>\n\u003cp class=\"v4-essay-signature\">Mariusz Gorlowski\u003c/p>\n\u003cp class=\"v4-research-label\">Research reference:\u003c/p>\n\u003cp>Hollanek, T. &amp; Nowaczyk-Basińska, K. (2024). Griefbots, Deadbots, Postmortem Avatars: on Responsible Applications of Generative AI in the Digital Afterlife Industry. Philosophy &amp; Technology, 37, Article 63.\u003c/p>\n\u003cp class=\"v4-source-link\">\u003ca href=\"https://doi.org/10.1007/s13347-024-00744-w\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1007/s13347-024-00744-w\u003c/a>\u003c/p>\u003c/div>\n\u003c/details>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122101570203546956\" rel=\"noopener noreferrer\" target=\"_blank\">Original post on Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n\u003c/article>\n\u003chr class=\"v4-gold-rule v4-essay-divider\" aria-hidden=\"true\"/>\n\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-10\">10 November 2026\u003c/time> · Independent essay\u003c/div>\n\u003ch3>The Day We Stop Saying No\u003c/h3>\n\u003cp class=\"v4-article-lead\">Nobody has taken away your freedom to choose. You can still disagree with a system's advice — but you do so less and less often. When does convenience begin to replace our own judgement? An essay about responsibility and the right to say no.\u003c/p>\n\u003cdetails class=\"v4-full-essay\" id=\"full-2026-11-10-say-no\">\n\u003csummary>\u003cspan class=\"v4-open-label\">Read the full essay\u003c/span>\u003cspan class=\"v4-close-label\">Close the essay\u003c/span>\u003cspan class=\"v4-expand-chevron\" aria-hidden=\"true\">⌄\u003c/span>\u003c/summary>\n\u003cdiv class=\"v4-essay-body\">\u003cp>Imagine a world in which no one has taken away our freedom.\u003c/p>\n\u003cp>You can still make your own decisions. You still have the right to disagree. You can still say no.\u003c/p>\n\u003cp>Except that, one day, you barely exercise that right any more.\u003c/p>\n\u003cp>Not because anyone has forced you.\u003c/p>\n\u003cp>But because the world has begun to function far more smoothly whenever you say yes.\u003c/p>\n\u003cp>What if this is how one of the greatest changes in human history begins?\u003c/p>\n\u003cp>Today, we increasingly rely on systems that help us make decisions. A satnav suggests a faster route. Algorithms recommend what we should read or watch. Artificial intelligence can draft messages, analyse information, present arguments and suggest solutions to problems.\u003c/p>\n\u003cp>There is nothing inherently wrong with this. We develop technology precisely because we want to make our lives easier.\u003c/p>\n\u003cp>But I would like to draw attention to a particular boundary.\u003c/p>\n\u003cp>There is a fundamental difference between a system that suggests what we should do and one that begins doing it for us.\u003c/p>\n\u003cp>Imagine using artificial intelligence at work.\u003c/p>\n\u003cp>At first, you ask it to draft a reply to a customer. You read the message, change a few sentences and send it.\u003c/p>\n\u003cp>After a while, you notice that its suggested replies are getting better and better. You rarely need to change anything.\u003c/p>\n\u003cp>Eventually, you allow the system to respond to some messages on its own.\u003c/p>\n\u003cp>It is convenient. It saves you time. You can concentrate on something more important.\u003c/p>\n\u003cp>Then you begin entrusting it with other tasks.\u003c/p>\n\u003cp>Until one day, you discover that the system is handling most of your correspondence, making small decisions and solving problems you never even knew had arisen.\u003c/p>\n\u003cp>You can still oversee everything.\u003c/p>\n\u003cp>But do you?\u003c/p>\n\u003cp>I am not suggesting that artificial intelligence has suddenly decided to seize control. AI need not be conscious, ambitious or driven by desires of its own for such a change to occur.\u003c/p>\n\u003cp>All it takes is for us to conclude, more and more often, that its suggestions are better than our own.\u003c/p>\n\u003cp>And then to start treating those suggestions not as proposals, but as decisions that are hardly worth questioning.\u003c/p>\n\u003cp>There is a name for this tendency: automation bias.\u003c/p>\n\u003cp>Researchers have been studying it for decades.\u003c/p>\n\u003cp>In a 1999 study involving a simulated flight task, Linda Skitka, Kathleen Mosier and Mark Burdick found that participants using an imperfect automated decision aid sometimes followed its recommendations even when those recommendations contradicted their training and other valid information available to them.\u003c/p>\n\u003cp>The study concerned earlier decision-support systems, not today's generative AI. But the pattern it found remains relevant: trusting a system too readily can make us less likely to check its recommendations.\u003c/p>\n\u003cp>Now imagine another situation.\u003c/p>\n\u003cp>You work in an organisation where a system analyses data and recommends particular actions. Approving one of its recommendations takes just a few seconds.\u003c/p>\n\u003cp>You can reject it, but then you have to explain your decision and accept responsibility if the outcome turns out to be worse.\u003c/p>\n\u003cp>Formally, the choice is still yours.\u003c/p>\n\u003cp>In practice, it becomes increasingly tempting simply to click 'Approve'.\u003c/p>\n\u003cp>And this brings me to a question that matters far more than it first appears:\u003c/p>\n\u003cp>Is a person truly independent if they are free to make their own decisions, but the entire system around them encourages them not to?\u003c/p>\n\u003cp>I am not claiming that the future must unfold this way.\u003c/p>\n\u003cp>Artificial intelligence could bring enormous benefits. It could help us discover things we might never have noticed ourselves, accelerate scientific research and solve problems that have challenged humanity for generations.\u003c/p>\n\u003cp>I am developing QR FINDER myself, a system that connects physical tags and stickers with a digital platform. I use digital tools, and I can see the extraordinary possibilities that advances in AI are opening up.\u003c/p>\n\u003cp>I would not want to live in a world where fear of the future leads us to abandon progress.\u003c/p>\n\u003cp>But neither would I want to live in a world where convenience becomes more important than our ability to think for ourselves.\u003c/p>\n\u003cp>There is something else worth considering.\u003c/p>\n\u003cp>Behind many of these systems are people, companies and institutions that establish the rules by which they operate.\u003c/p>\n\u003cp>So the question of who controls AI is also a question of who sets the terms for everyone who depends on it.\u003c/p>\n\u003cp>Perhaps the greatest danger will not be the day when artificial intelligence takes away humanity's ability to make decisions.\u003c/p>\n\u003cp>Perhaps it will be the day when humanity decides, of its own accord, that making decisions is no longer necessary.\u003c/p>\n\u003cp>In my book The Transition Code, I explore the possibility that humanity represents a transitional stage in the evolution of intelligence.\u003c/p>\n\u003cp>But before we begin asking whether artificial intelligence might become our successor, perhaps we should ask a more immediate question:\u003c/p>\n\u003cp>Can we benefit from an intelligence that helps us make better decisions without losing the courage to make our own?\u003c/p>\n\u003cp>I would like to hear your thoughts.\u003c/p>\n\u003cp>Where would you draw the line?\u003c/p>\n\u003cp>In which areas would you allow artificial intelligence to make decisions on your behalf, and where would you always want to have the final say?\u003c/p>\n\u003cp class=\"v4-essay-signature\">Mariusz Gorlowski\u003c/p>\n\u003cp class=\"v4-research-label\">Research reference:\u003c/p>\n\u003cp>Skitka, L. J., Mosier, K. L. &amp; Burdick, M. (1999). “Does automation bias decision-making?” International Journal of Human-Computer Studies, 51(5), 991–1006.\u003c/p>\n\u003cp class=\"v4-source-link\">\u003ca href=\"https://doi.org/10.1006/ijhc.1999.0252\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1006/ijhc.1999.0252\u003c/a>\u003c/p>\u003c/div>\n\u003c/details>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122098148013546956\" rel=\"noopener noreferrer\" target=\"_blank\">Original post on Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n\u003c/article>\u003c!-- AUTO:ESSAYS:END -->\u003c/div>\n\u003ca class=\"v4-more\" href=\"https://www.facebook.com/122101706787546956\" target=\"_blank\" rel=\"noopener noreferrer\">More writing on Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Ireland-based writer and essayist · Author of The Transition Code book project · Founder of QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"../../writing/\">Writing &amp; Books\u003c/a>\n\u003ca href=\"../../qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"../../contact/\">Contact\u003c/a>\u003ca href=\"../../privacy.html\">Privacy\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · All rights reserved.\u003c/span>\n\u003cspan>Independent author website · Unpublished manuscripts clearly identified\u003c/span>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","pl|/writing/essays/":"\u003c!doctype html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>Eseje i publikacje | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Wybrane eseje Mariusza Gorlowskiego o AI, człowieczeństwie, żałobie, odpowiedzialności i naszych decyzjach.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/pl/writing/essays/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/writing/essays/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/writing/essays/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"Eseje i publikacje | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Wybrane eseje Mariusza Gorlowskiego o AI, człowieczeństwie, żałobie, odpowiedzialności i naszych decyzjach.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/pl/writing/essays/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"/assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"/styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"/v4.css?v=20261117-photo-essay-a\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-essays\">\u003ca class=\"skip-link\" href=\"#main\">Przejdź do treści\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — strona główna\" class=\"brand\" href=\"/pl/\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Nawigacja główna\" class=\"desktop-nav\">\n\u003ca href=\"/pl/\">Strona główna\u003c/a>\n\u003ca aria-current=\"page\" href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"/pl/contact/\">Napisz do mnie \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Język / Language\">\u003ca href=\"https://mariuszgorlowski.com/writing/essays/\" hreflang=\"en\" lang=\"en\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/writing/essays/\" hreflang=\"pl\" lang=\"pl\" aria-current=\"page\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"/pl/\">\u003cspan aria-hidden=\"true\">←\u003c/span> Wróć do profilu\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>Twórczość i książki\u003c/h1>\u003cp>Wybrane eseje i niezależne komentarze.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"Sekcje twórczości\" class=\"v4-tabs\">\u003ca class=\"\" href=\"/pl/writing/\">Książki\u003c/a>\u003ca class=\"active\" aria-current=\"page\" href=\"/pl/writing/essays/\">Eseje i publikacje\u003c/a>\u003ca class=\"\" href=\"/pl/contact/?topic=literary\">Kontakt\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection class=\"paper-card v4-publications\" aria-labelledby=\"essays-title\">\n\u003cdiv class=\"section-label\">Wybrana twórczość\u003c/div>\n\u003ch2 id=\"essays-title\">Eseje i publikacje\u003c/h2>\n\u003cp class=\"section-intro\">\u003cstrong>Wielkie pytania. Zwykłe ludzkie historie.\u003c/strong>\u003c/p>\n\u003cp>Nie każde ważne pytanie wymaga całej książki. Czasem wszystko zaczyna się od telefonu, rodzinnej rozmowy albo decyzji, którą coraz chętniej pozostawiamy maszynie.\u003c/p>\n\u003cp>W esejach przyglądam się miejscom, w których technologia spotyka się z ludzkimi emocjami, przyzwyczajeniami i odpowiedzialnością. Zestawiam wyobrażone sytuacje z prawdziwymi badaniami, nie przedstawiając fikcji jako dowodu naukowego.\u003c/p>\n\u003cp>Nie zależy mi na dzieleniu ludzi na zachwyconych AI i tych, którzy się jej obawiają. Bardziej interesuje mnie, dlaczego ta sama technologia może znaczyć coś zupełnie innego dla różnych osób.\u003c/p>\n\u003cfigure class=\"v4-author-photo v4-photo-essays\">\n  \u003cimg src=\"/assets/book_concept.webp\" width=\"1500\" height=\"571\" loading=\"lazy\" decoding=\"async\" alt=\"Mariusz Gorlowski w płaszczu w kolorze camel, trzymający książkę Kod Przejściowy\">\n\u003c/figure>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"v4-article-list\">\u003c!-- AUTO:ESSAYS:START -->\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-13\">13 listopada 2026\u003c/time> · Esej autorski\u003c/div>\n\u003ch3>Co, jeśli zadzwoni ktoś, kogo już nie ma?\u003c/h3>\n\u003cp class=\"v4-article-lead\">Wyobraź sobie telefon od bliskiej osoby, której już nie ma. Wiesz, że jej głos odtworzyła sztuczna inteligencja. Czy przyniósłby Ci ukojenie, czy utrudnił pogodzenie się ze stratą? Fikcyjna historia rodziny o żałobie, więzi i granicach technologii.\u003c/p>\n\u003cdetails class=\"v4-full-essay\" id=\"full-2026-11-13-voice\">\u003csummary>\u003cspan class=\"v4-open-label\">Przeczytaj cały esej\u003c/span>\u003cspan class=\"v4-close-label\">Zwiń esej\u003c/span>\u003cspan class=\"v4-expand-chevron\" aria-hidden=\"true\">⌄\u003c/span>\u003c/summary>\n\u003cdiv class=\"v4-essay-body\">\u003cp>Wyobraź sobie rodzinę, w której dwoje dzieci w wieku szkolnym traci matkę.\u003c/p>\n\u003cp>Zostają z ojcem, któremu trudno pogodzić się ze śmiercią żony.\u003c/p>\n\u003cp>Wieczorami młodsze dziecko pyta, kiedy mama wróci. Starsze coraz rzadziej opowiada o swoim dniu. Ojciec próbuje być dla nich oparciem, choć sam ledwo sobie radzi.\u003c/p>\n\u003cp>Zostały im tylko zdjęcia, rodzinne nagrania i wiadomości głosowe.\u003c/p>\n\u003cp>Na ich podstawie system sztucznej inteligencji potrafi odtworzyć głos i twarz kobiety, a nawet prowadzić rozmowy podobne do tych, które odbywali z nią przed jej śmiercią.\u003c/p>\n\u003cp>Ojciec postanawia spróbować.\u003c/p>\n\u003cp>Nie dla siebie. Dla dzieci.\u003c/p>\n\u003cp>Początkowo niepewnie patrzą w ekran. Potem zaczynają opowiadać o szkole, przyjaciołach i drobnych sukcesach. Słyszą znajomy głos. Znów mogą posłuchać bajki przed snem.\u003c/p>\n\u003cp>Wieczory stają się spokojniejsze.\u003c/p>\n\u003cp>W tej wymyślonej historii dzieci stopniowo wracają do zabawy, spotkań z przyjaciółmi i codziennych zajęć. Nie zapominają o matce. Ale zaczynają uczyć się życia z jej nieobecnością.\u003c/p>\n\u003cp>Ojciec widzi zmianę i odczuwa ulgę.\u003c/p>\n\u003cp>Pewnego wieczoru, kiedy dzieci już zasnęły, sam uruchamia system.\u003c/p>\n\u003cp>Chce tylko przez chwilę usłyszeć głos żony.\u003c/p>\n\u003cp>Rozmowa trwa pięć minut.\u003c/p>\n\u003cp>Następnego wieczoru trochę dłużej.\u003c/p>\n\u003cp>Później staje się codziennym rytuałem.\u003c/p>\n\u003cp>Mijają miesiące.\u003c/p>\n\u003cp>Dzieci coraz rzadziej proszą o rozmowę ze swoją cyfrową mamą.\u003c/p>\n\u003cp>Ojciec natomiast korzysta z systemu coraz częściej.\u003c/p>\n\u003cp>Odrzuca zaproszenia od przyjaciół. Odkłada spotkania. Woli zostać w domu, gdzie może usłyszeć znajomy śmiech i opowiedzieć o wszystkim, co wydarzyło się w ciągu dnia.\u003c/p>\n\u003cp>System zawsze ma dla niego czas.\u003c/p>\n\u003cp>Aż pewnego wieczoru jedno z dzieci mówi:\u003c/p>\n\u003cp>„Tato, nie musimy dziś rozmawiać z mamą”.\u003c/p>\n\u003cp>Ojciec odpowiada:\u003c/p>\n\u003cp>„Ale ja muszę”.\u003c/p>\n\u003cp>Ta sama technologia, która pomogła dzieciom ruszyć naprzód, zaczęła zatrzymywać ich ojca w przeszłości.\u003c/p>\n\u003cp>Nie dlatego, że system się zmienił.\u003c/p>\n\u003cp>Zmieniło się to, czego potrzebowali od niego korzystający z niego ludzie.\u003c/p>\n\u003cp>To fikcyjna opowieść. Ale technologia, która mogłaby uczynić ją możliwą, już istnieje.\u003c/p>\n\u003cp>W 2024 roku badacze z Uniwersytetu Cambridge, Tomasz Hollanek i Katarzyna Nowaczyk-Basińska, opisali zagrożenia związane z cyfrowym odtwarzaniem osób zmarłych. Wskazali między innymi na emocjonalne konsekwencje takich relacji i trudności, które mogą pojawić się, gdy ktoś próbuje je zakończyć.\u003c/p>\n\u003cp>Ich badania nie dowodzą, że taka technologia pomaga dzieciom ani że szkodzi dorosłym. Pokazują jednak, jak wiele pytań pozostaje bez odpowiedzi, zwłaszcza gdy chodzi o osoby w żałobie i o dzieci.\u003c/p>\n\u003cp>Czy właśnie dlatego tak trudno nam dojść do porozumienia w sprawie AI?\u003c/p>\n\u003cp>Jedni widzą w niej ratunek. Inni zagrożenie.\u003c/p>\n\u003cp>Ale czy któraś ze stron musi się mylić?\u003c/p>\n\u003cp>Być może zbyt wiele czasu poświęcamy na pytanie, czy sztuczna inteligencja jest dobra, czy zła, zamiast zastanawiać się, komu pomaga, w jakich okolicznościach i jakie może przynieść konsekwencje.\u003c/p>\n\u003cp>Czy coś, co pomaga człowiekowi dzisiaj, musi pozostać dla niego dobre jutro?\u003c/p>\n\u003cp>Dla dzieci głos matki stał się mostem prowadzącym z powrotem do codziennego życia. Dla ojca — schronieniem przed teraźniejszością.\u003c/p>\n\u003cp>Jedna rodzina. Jedna strata. Jeden system. Dwa różne rezultaty.\u003c/p>\n\u003cp>A teraz wyobraź sobie, że jutro dzwoni Twój telefon.\u003c/p>\n\u003cp>Na ekranie pojawia się imię osoby, której już nie ma.\u003c/p>\n\u003cp>Wiesz, że to sztuczna inteligencja.\u003c/p>\n\u003cp>Wiesz też, że po drugiej stronie usłyszysz znajomy głos.\u003c/p>\n\u003cp>Naciśniesz zielony czy czerwony przycisk?\u003c/p>\n\u003cp class=\"v4-essay-signature\">Mariusz Gorlowski\u003c/p>\n\u003cp class=\"v4-research-label\">Źródło naukowe:\u003c/p>\n\u003cp>Hollanek, T. &amp; Nowaczyk-Basińska, K. (2024). Griefbots, Deadbots, Postmortem Avatars: on Responsible Applications of Generative AI in the Digital Afterlife Industry. Philosophy &amp; Technology, 37, Article 63.\u003c/p>\n\u003cp class=\"v4-source-link\">\u003ca href=\"https://doi.org/10.1007/s13347-024-00744-w\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1007/s13347-024-00744-w\u003c/a>\u003c/p>\u003c/div>\u003c/details>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122101570203546956\" rel=\"noopener noreferrer\" target=\"_blank\">Oryginalny wpis na Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\n\u003chr class=\"v4-gold-rule v4-essay-divider\" aria-hidden=\"true\"/>\n\u003carticle class=\"v4-article\">\n\u003cdiv class=\"v4-article-meta\">\u003ctime datetime=\"2026-11-10\">10 listopada 2026\u003c/time> · Esej autorski\u003c/div>\n\u003ch3>Dzień, w którym przestaniemy mówić „nie”\u003c/h3>\n\u003cp class=\"v4-article-lead\">Nikt nie odebrał Ci wolności wyboru. Nadal możesz nie zgadzać się z zaleceniami systemu, ale robisz to coraz rzadziej. Kiedy wygoda zaczyna zastępować własny osąd? Esej o odpowiedzialności i prawie do odmowy.\u003c/p>\n\u003cdetails class=\"v4-full-essay\" id=\"full-2026-11-10-say-no\">\u003csummary>\u003cspan class=\"v4-open-label\">Przeczytaj cały esej\u003c/span>\u003cspan class=\"v4-close-label\">Zwiń esej\u003c/span>\u003cspan class=\"v4-expand-chevron\" aria-hidden=\"true\">⌄\u003c/span>\u003c/summary>\n\u003cdiv class=\"v4-essay-body\">\u003cp>Wyobraź sobie świat, w którym nikt nie odebrał nam wolności.\u003c/p>\n\u003cp>Nadal możesz podejmować własne decyzje. Masz prawo się nie zgadzać. Wciąż możesz powiedzieć „nie”.\u003c/p>\n\u003cp>Tyle że pewnego dnia prawie przestajesz korzystać z tego prawa.\u003c/p>\n\u003cp>Nie dlatego, że ktoś Cię do tego zmusił.\u003c/p>\n\u003cp>Po prostu świat zaczyna działać znacznie sprawniej za każdym razem, gdy mówisz „tak”.\u003c/p>\n\u003cp>A jeśli właśnie w ten sposób rozpocznie się jedna z największych zmian w historii ludzkości?\u003c/p>\n\u003cp>Już dziś coraz częściej polegamy na systemach wspomagających podejmowanie decyzji. Nawigacja proponuje szybszą trasę. Algorytmy podpowiadają, co przeczytać lub obejrzeć. Sztuczna inteligencja może pisać wiadomości, analizować informacje, przedstawiać argumenty i proponować rozwiązania problemów.\u003c/p>\n\u003cp>Nie ma w tym niczego z natury złego. Właśnie po to rozwijamy technologię, by ułatwiać sobie życie.\u003c/p>\n\u003cp>Chciałbym jednak zwrócić uwagę na pewną granicę.\u003c/p>\n\u003cp>Istnieje zasadnicza różnica między systemem, który podpowiada nam, co zrobić, a takim, który zaczyna robić to za nas.\u003c/p>\n\u003cp>Wyobraź sobie, że używasz sztucznej inteligencji w pracy.\u003c/p>\n\u003cp>Najpierw prosisz ją o przygotowanie odpowiedzi dla klienta. Czytasz wiadomość, zmieniasz kilka zdań i wysyłasz.\u003c/p>\n\u003cp>Po pewnym czasie zauważasz, że proponowane odpowiedzi są coraz lepsze. Rzadko trzeba cokolwiek poprawiać.\u003c/p>\n\u003cp>W końcu pozwalasz systemowi samodzielnie odpowiadać na część wiadomości.\u003c/p>\n\u003cp>To wygodne. Oszczędzasz czas. Możesz zająć się czymś ważniejszym.\u003c/p>\n\u003cp>Później powierzasz mu kolejne zadania.\u003c/p>\n\u003cp>Aż pewnego dnia odkrywasz, że system obsługuje większość Twojej korespondencji, podejmuje drobne decyzje i rozwiązuje problemy, o których istnieniu nawet nie wiedziałeś.\u003c/p>\n\u003cp>Nadal możesz wszystko nadzorować.\u003c/p>\n\u003cp>Ale czy to robisz?\u003c/p>\n\u003cp>Nie sugeruję, że sztuczna inteligencja nagle postanowiła przejąć kontrolę. Taka zmiana nie wymaga, aby AI miała świadomość, ambicje czy własne pragnienia.\u003c/p>\n\u003cp>Wystarczy, że coraz częściej będziemy uznawać jej propozycje za lepsze od własnych.\u003c/p>\n\u003cp>A potem zaczniemy traktować je nie jak sugestie, lecz jak decyzje, których prawie nie warto kwestionować.\u003c/p>\n\u003cp>To zjawisko ma swoją nazwę: tendencyjność automatyzacji (automation bias).\u003c/p>\n\u003cp>Badacze zajmują się nim od dziesięcioleci.\u003c/p>\n\u003cp>W badaniu z 1999 roku, wykorzystującym symulowane zadanie lotnicze, Linda Skitka, Kathleen Mosier i Mark Burdick zauważyli, że uczestnicy korzystający z niedoskonałego automatycznego systemu wspomagania decyzji niekiedy stosowali się do jego wskazań, nawet gdy były one sprzeczne z ich szkoleniem i innymi dostępnymi, prawidłowymi informacjami.\u003c/p>\n\u003cp>Badanie dotyczyło starszych systemów wspomagania decyzji, a nie dzisiejszej generatywnej AI. Wykazany w nim mechanizm pozostaje jednak istotny: nadmierne zaufanie do systemu może sprawić, że rzadziej sprawdzamy jego zalecenia.\u003c/p>\n\u003cp>Wyobraź sobie teraz inną sytuację.\u003c/p>\n\u003cp>Pracujesz w organizacji, w której system analizuje dane i rekomenduje określone działania. Zatwierdzenie jego propozycji zajmuje kilka sekund.\u003c/p>\n\u003cp>Możesz ją odrzucić, ale musisz wtedy uzasadnić decyzję i przyjąć odpowiedzialność, jeśli rezultat okaże się gorszy.\u003c/p>\n\u003cp>Formalnie wybór nadal należy do Ciebie.\u003c/p>\n\u003cp>W praktyce coraz bardziej kusi, by po prostu kliknąć „Zatwierdź”.\u003c/p>\n\u003cp>I tu pojawia się pytanie znacznie ważniejsze, niż mogłoby się wydawać:\u003c/p>\n\u003cp>Czy człowiek jest naprawdę niezależny, jeśli wolno mu podejmować własne decyzje, ale cały system wokół niego zachęca, by tego nie robił?\u003c/p>\n\u003cp>Nie twierdzę, że przyszłość musi wyglądać właśnie tak.\u003c/p>\n\u003cp>Sztuczna inteligencja może przynieść ogromne korzyści. Może pomóc odkryć rzeczy, których sami byśmy nie dostrzegli, przyspieszyć badania naukowe i rozwiązać problemy, z którymi ludzkość zmaga się od pokoleń.\u003c/p>\n\u003cp>Sam rozwijam QR FINDER — system łączący fizyczne zawieszki i naklejki z platformą cyfrową. Korzystam z narzędzi cyfrowych i widzę niezwykłe możliwości, jakie otwiera postęp w dziedzinie AI.\u003c/p>\n\u003cp>Nie chciałbym żyć w świecie, w którym strach przed przyszłością każe nam porzucić postęp.\u003c/p>\n\u003cp>Ale nie chciałbym też świata, w którym wygoda staje się ważniejsza od zdolności samodzielnego myślenia.\u003c/p>\n\u003cp>Warto zastanowić się nad jeszcze jedną rzeczą.\u003c/p>\n\u003cp>Za wieloma takimi systemami stoją ludzie, firmy i instytucje, które ustalają zasady ich działania.\u003c/p>\n\u003cp>Dlatego pytanie o to, kto kontroluje AI, jest również pytaniem o to, kto wyznacza warunki wszystkim, którzy od tej technologii zależą.\u003c/p>\n\u003cp>Być może największe zagrożenie nie nadejdzie w dniu, w którym sztuczna inteligencja odbierze ludzkości możliwość podejmowania decyzji.\u003c/p>\n\u003cp>Być może nadejdzie w dniu, w którym ludzkość sama uzna, że nie musi już ich podejmować.\u003c/p>\n\u003cp>W mojej książce „Kod Przejściowy” rozważam możliwość, że ludzkość stanowi etap przejściowy w ewolucji inteligencji.\u003c/p>\n\u003cp>Zanim jednak zaczniemy pytać, czy sztuczna inteligencja może stać się naszym następcą, być może powinniśmy zadać sobie bardziej bezpośrednie pytanie:\u003c/p>\n\u003cp>Czy potrafimy korzystać z inteligencji, która pomaga nam podejmować lepsze decyzje, nie tracąc odwagi do podejmowania własnych?\u003c/p>\n\u003cp>Chciałbym poznać Twoją opinię.\u003c/p>\n\u003cp>Gdzie postawiłbyś granicę?\u003c/p>\n\u003cp>W jakich sprawach pozwoliłbyś sztucznej inteligencji decydować za siebie, a w jakich zawsze chciałbyś mieć ostatnie słowo?\u003c/p>\n\u003cp class=\"v4-essay-signature\">Mariusz Gorlowski\u003c/p>\n\u003cp class=\"v4-research-label\">Źródło naukowe:\u003c/p>\n\u003cp>Skitka, L. J., Mosier, K. L. &amp; Burdick, M. (1999). “Does automation bias decision-making?” International Journal of Human-Computer Studies, 51(5), 991–1006.\u003c/p>\n\u003cp class=\"v4-source-link\">\u003ca href=\"https://doi.org/10.1006/ijhc.1999.0252\" target=\"_blank\" rel=\"noopener noreferrer\">https://doi.org/10.1006/ijhc.1999.0252\u003c/a>\u003c/p>\u003c/div>\u003c/details>\n\u003cdiv class=\"v4-article-links\">\u003ca href=\"https://www.facebook.com/122101706787546956/posts/122098148013546956\" rel=\"noopener noreferrer\" target=\"_blank\">Oryginalny wpis na Facebook \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\u003c/article>\u003c!-- AUTO:ESSAYS:END -->\u003c/div>\n\u003ca class=\"v4-more\" href=\"https://www.facebook.com/122101706787546956\" target=\"_blank\" rel=\"noopener noreferrer\">Więcej moich tekstów na Facebooku \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Autor i eseista mieszkający w Irlandii · Autor projektu książkowego „Kod Przejściowy” · Twórca QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"/pl/contact/\">Kontakt\u003c/a>\u003ca href=\"/pl/privacy.html\">Prywatność\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · Wszelkie prawa zastrzeżone.\u003c/span>\n\u003cspan>Niezależna strona autorska · Nieopublikowane rękopisy wyraźnie oznaczone\u003c/span>\u003c/div>\u003c/footer>\u003c/body>\u003c/html>","en|/qr-finder/":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>QR FINDER | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Discover QR FINDER: metal tags, public and private information stickers, digital profiles, scan counters and large-format designs.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/qr-finder/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/qr-finder/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/qr-finder/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"QR FINDER | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Metal tags, information stickers and digital profiles — practical QR FINDER products and the story behind their development.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/qr-finder/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"../assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"../styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"../v4.css?v=20261117-tags-full-1\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-system\">\u003ca class=\"skip-link\" href=\"#main\">Skip to content\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — home\" class=\"brand\" href=\"../\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Main navigation\" class=\"desktop-nav\">\n\u003ca href=\"../\">Home\u003c/a>\n\u003ca href=\"../writing/\">Writing &amp; Books\u003c/a>\n\u003ca aria-current=\"page\" href=\"../qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"../contact/\">Get in touch \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Language / Język\">\u003ca href=\"https://mariuszgorlowski.com/qr-finder/\" lang=\"en\" hreflang=\"en\" aria-current=\"page\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/qr-finder/\" lang=\"pl\" hreflang=\"pl\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"../\">\u003cspan aria-hidden=\"true\">←\u003c/span> Back to profile\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>QR FINDER\u003c/h1>\u003cp>From a simple metal tag to a wider system of practical ways to connect physical objects with useful information.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"QR FINDER sections\" class=\"v4-tabs\">\u003ca class=\"active\" aria-current=\"page\" href=\"../qr-finder/\">System\u003c/a>\u003ca class=\"\" href=\"../qr-finder/articles/\">Articles &amp; Updates\u003c/a>\u003ca class=\"\" href=\"../contact/?topic=qr\">Contact\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection aria-labelledby=\"qr-title\" class=\"paper-card qr-card\" id=\"qr-finder\">\n\u003cdiv class=\"section-label\">04 / Technology &amp; Entrepreneurship\u003c/div>\n\u003cdiv class=\"qr-heading\">\u003cdiv>\u003ch2 id=\"qr-title\">QR FINDER\u003c/h2>\u003cdiv class=\"v4-book-status v4-project-status v4-status-search\">\u003cspan class=\"v4-status-dot\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>Current status:\u003c/strong> Preparing for public launch.\u003c/span>\u003c/div>\u003c/div>\u003cspan aria-hidden=\"true\" class=\"qr-mark\">▦\u003c/span>\u003c/div>\n\u003cdiv class=\"qr-intro\">\n\u003cdiv>\n\u003ch3>Someone has found what you have lost. What happens next?\u003c/h3>\n\u003cp>Keys left in a café. A suitcase misplaced on a journey. A dog that runs off during a walk.\u003c/p>\n\u003cp>These situations are different, but they share one problem: even if somebody finds what has been lost, they may have no way to contact its owner.\u003c/p>\n\u003cp>That is the problem QR FINDER was created to address.\u003c/p>\n\u003ch3>From a small metal tag to a wider system\u003c/h3>\n\u003cp>It began with the idea of making a well-designed metal tag — something attractive and durable, but above all useful. From the start, I wanted it to do more than carry a code.\u003c/p>\n\u003cp>Traditional tags often have a phone number or other details engraved on them. When those details change, the tag may have to be replaced. I wanted to connect the physical object to a digital profile that could be updated instead.\u003c/p>\n\u003cp>QR FINDER grew from that idea into a system of metal tags, information stickers and a mobile-friendly web platform. As I worked on it, new products, functions and uses began to emerge.\u003c/p>\n\u003c/div>\n\u003cfigure class=\"founder-photo\">\u003cimg alt=\"Mariusz Gorlowski in a white shirt in the QR FINDER workspace\" height=\"1484\" loading=\"lazy\" src=\"../assets/founder_white.webp\" width=\"1500\"/>\u003cfigcaption>Behind the project\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cdiv class=\"product-photo\">\u003cimg alt=\"Design preview showing four QR FINDER metal tag finishes: copper, steel, brass and aluminium\" height=\"941\" loading=\"lazy\" src=\"../assets/tags.webp\" width=\"1672\"/>\u003cspan>Design preview · four materials\u003c/span>\u003c/div>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"how-it-works\">\u003ch3 id=\"how-it-works\">How does it work?\u003c/h3>\n\u003cdiv class=\"feature-grid\">\n\u003cdiv>\u003cstrong>1. No app needed for the finder\u003c/strong>\u003cp>Scanning a code linked to a public profile opens Finder View. The person who finds an item or pet can see the information the owner has shared and use the available contact options, without installing an app or creating an account.\u003c/p>\u003c/div>\n\u003cdiv>\u003cstrong>2. Information can be updated\u003c/strong>\u003cp>Changed your phone number or need to correct a pet's details? You can update the digital profile without replacing the tag or sticker.\u003c/p>\u003c/div>\n\u003cdiv>\u003cstrong>3. You decide what to share\u003c/strong>\u003cp>Not everything saved in a profile needs to be visible. The owner chooses which additional details are shared with a finder and which remain private.\u003c/p>\u003c/div>\n\u003cdiv>\u003cstrong>4. Lost Mode\u003c/strong>\u003cp>When Lost Mode is enabled, a scan can display a clear “Reported lost” notice. If notifications are enabled, the owner may receive the date and time of the scan. A finder can choose to share their location, but it is not tracked automatically.\u003c/p>\u003c/div>\n\u003c/div>\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"pet-example\">\u003ch3 id=\"pet-example\">An example: a pet's profile\u003c/h3>\n\u003cp>Imagine somebody finds your dog. They do not know its habits, whether it is frightened by noise or if it has an allergy or takes medication.\u003c/p>\n\u003cp>QR FINDER's detailed free pet profile lets owners record useful information about a pet's appearance, behaviour, microchip and veterinary care, as well as important health instructions. Owners choose which additional details they want a finder to see.\u003c/p>\n\u003cp>That means a tag can tell somebody much more than a phone number while leaving the owner in control of what is shared. It was QR FINDER's first and most detailed free application, but the system is not limited to pets.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"stickers\">\u003ch3 id=\"stickers\">Information stickers — new possibilities\u003c/h3>\n\u003cp>Something does not have to be lost for extra information to be useful. That is why I have also been developing QR FINDER information stickers for everyday objects.\u003c/p>\n\u003cp>A bicycle, electronic equipment, tools, household items, spare parts or something that needs instructions or a record of its history — there are many possible applications. Instead of keeping information in several places, you can associate it with a particular object and access it by scanning the code.\u003c/p>\n\u003cp>Depending on the profile, available features include photographs, a scan counter, a notepad, a calendar for dates and reminders, and a calculator for quick tasks.\u003c/p>\n\u003cp>More extensive records, documents and histories may be available through separate paid Books. These premium features should not be confused with the basic free profile.\u003c/p>\n\u003ch3>Public or private? The choice is yours.\u003c/h3>\n\u003cp>\u003cstrong>Public:\u003c/strong> the information you choose to share can be viewed by anyone who scans the sticker. This can be useful for instructions, contact details and other information intended to be accessible.\u003c/p>\n\u003cp>\u003cstrong>Private:\u003c/strong> access to the information is protected by a password, for cases where you want a digital record but do not want everyone to be able to read it.\u003c/p>\n\u003cp>It is the same simple principle — a small sticker linked to useful digital information — adapted to different needs.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"large-format\">\u003ch3 id=\"large-format\">Large-format stickers — for cars and beyond\u003c/h3>\n\u003cp>I have also developed larger sticker designs for cars and other applications where a code needs to stand out and be easy to notice.\u003c/p>\n\u003cp>The larger format is intended to make scanning possible from further away, where lighting, distance and other conditions allow. It could provide quick access to a digital contact card, contact details or other chosen information without anyone having to type in a website address.\u003c/p>\n\u003cp>A car is only one example. The same approach could be useful wherever visibility matters.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"whats-next\">\u003ch3 id=\"whats-next\">A project that keeps growing\u003c/h3>\n\u003cp>QR FINDER has not developed according to one fixed plan. Many ideas have emerged while designing new products and exploring how people might use them.\u003c/p>\n\u003cp>I have more ideas I would like to develop, but I would rather share new features when they are ready than make promises too early. I will post updates as the project moves forward.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"why\">\u003ch3 id=\"why\">Why I created QR FINDER\u003c/h3>\n\u003cp>I cannot promise that every lost pet or belonging will be found. A QR FINDER tag does not track an object's location and is not a GPS tracker.\u003c/p>\n\u003cp>But I wanted to give somebody who finds an important item a simple way to help — to let its owner know that it has been found.\u003c/p>\n\u003cp>Over time, I realised that the same idea could be useful in many other situations, wherever a physical object could benefit from access to relevant information. That is the direction in which I want to keep developing QR FINDER.\u003c/p>\n\u003c/section>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003cdiv class=\"qr-bottom\">\u003cp>QR FINDER is in the final stages of preparation. Its official website and online shop are not yet open to the public. I will announce the launch date once it is confirmed. The metal tag images shown here are design previews.\u003c/p>\u003ca class=\"btn btn-dark\" href=\"../contact/?topic=qr\">QR FINDER enquiries \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\u003c/div>\n\u003c/section>\u003c/div>\u003c/main>\u003cfooter class=\"footer\">\u003cdiv class=\"container footer-content\">\n\u003cdiv>\u003cdiv class=\"footer-brand\">Mariusz Gorlowski\u003c/div>\n\u003cp>Ireland-based writer and essayist · Author of The Transition Code book project · Founder of QR FINDER.\u003c/p>\u003c/div>\n\u003cdiv class=\"footer-links\">\u003ca href=\"../writing/\">Writing &amp; Books\u003c/a>\n\u003ca href=\"../qr-finder/\">QR FINDER\u003c/a>\n\u003ca href=\"../contact/\">Contact\u003c/a>\u003ca href=\"../privacy.html\">Privacy\u003c/a>\u003c/div>\n\u003c/div>\u003cdiv class=\"container footer-end\">\u003cspan>© 2026 Mariusz Gorlowski · All rights reserved.\u003c/span>\n\u003cspan>Independent author website · Unpublished manuscripts clearly identified\u003c/span>\u003c/div>\u003c/footer>\n\u003cscript id=\"qr-tags-mobile-placement\">\n/* On narrow screens, separate the two existing original photos.\n   Desktop keeps the original positions; no image is duplicated. */\n(function () {\n  const intro = document.querySelector('#qr-finder .qr-intro');\n  const tags = document.querySelector('#qr-finder .product-photo');\n  const petExample = document.querySelector('#qr-finder section[aria-labelledby=\"pet-example\"]');\n  if (!intro || !tags || !petExample) return;\n\n  const mobile = window.matchMedia('(max-width: 760px)');\n  function arrangePhotos() {\n    if (mobile.matches) {\n      petExample.after(tags);\n    } else {\n      intro.after(tags);\n    }\n  }\n  arrangePhotos();\n  if (mobile.addEventListener) {\n    mobile.addEventListener('change', arrangePhotos);\n  } else if (mobile.addListener) {\n    mobile.addListener(arrangePhotos);\n  }\n}());\n\u003c/script>\n\u003c/body>\u003c/html>","pl|/qr-finder/":"\u003c!doctype html>\n\u003chtml lang=\"pl\">\u003chead>\n\u003cmeta charset=\"utf-8\"/>\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"/>\n\u003cmeta name=\"theme-color\" content=\"#101d24\"/>\n\u003cmeta name=\"robots\" content=\"index,follow,max-image-preview:large\"/>\n\u003ctitle>QR FINDER | Mariusz Gorlowski\u003c/title>\n\u003cmeta name=\"description\" content=\"Poznaj QR FINDER: metalowe zawieszki, naklejki informacyjne, profile cyfrowe i rozwój systemu.\"/>\n\u003clink rel=\"canonical\" href=\"https://mariuszgorlowski.com/pl/qr-finder/\"/>\n\u003clink rel=\"alternate\" hreflang=\"en\" href=\"https://mariuszgorlowski.com/qr-finder/\"/>\n\u003clink rel=\"alternate\" hreflang=\"pl\" href=\"https://mariuszgorlowski.com/pl/qr-finder/\"/>\n\u003cmeta property=\"og:type\" content=\"website\"/>\n\u003cmeta property=\"og:site_name\" content=\"Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:title\" content=\"QR FINDER | Mariusz Gorlowski\"/>\n\u003cmeta property=\"og:description\" content=\"Poznaj QR FINDER: metalowe zawieszki, naklejki informacyjne, profile cyfrowe i rozwój systemu.\"/>\n\u003cmeta property=\"og:url\" content=\"https://mariuszgorlowski.com/pl/qr-finder/\"/>\n\u003cmeta property=\"og:image\" content=\"https://mariuszgorlowski.com/assets/cover.webp\"/>\n\u003cmeta name=\"twitter:card\" content=\"summary_large_image\"/>\n\u003clink href=\"/assets/favicon.svg\" rel=\"icon\" type=\"image/svg+xml\"/>\n\u003clink href=\"/styles.css?v=20261117-pl-review-1\" rel=\"stylesheet\"/>\n\u003clink href=\"/v4.css?v=20261117-tags-full-1\" rel=\"stylesheet\"/>\n\n\u003c/head>\u003cbody class=\"v4-system\">\u003ca class=\"skip-link\" href=\"#main\">Przejdź do treści\u003c/a>\n\u003cheader class=\"topbar\">\u003cdiv class=\"container topbar-inner\">\n\u003ca aria-label=\"Mariusz Gorlowski — strona główna\" class=\"brand\" href=\"/pl/\">\u003cspan class=\"brand-symbol\">MG\u003c/span>\u003cspan>Mariusz Gorlowski\u003c/span>\u003c/a>\n\u003cnav aria-label=\"Nawigacja główna\" class=\"desktop-nav\">\n\u003ca href=\"/pl/\">Strona główna\u003c/a>\n\u003ca href=\"/pl/writing/\">Twórczość i książki\u003c/a>\n\u003ca aria-current=\"page\" href=\"/pl/qr-finder/\">QR FINDER\u003c/a>\n\u003c/nav>\u003ca class=\"nav-contact\" href=\"/pl/contact/\">Napisz do mnie \u003cspan aria-hidden=\"true\">↗\u003c/span>\u003c/a>\n\u003cnav class=\"lang-switch\" aria-label=\"Język / Language\">\u003ca href=\"https://mariuszgorlowski.com/qr-finder/\" lang=\"en\" hreflang=\"en\" title=\"English\">EN\u003c/a>\u003cspan aria-hidden=\"true\">/\u003c/span>\u003ca href=\"https://mariuszgorlowski.com/pl/qr-finder/\" lang=\"pl\" hreflang=\"pl\" aria-current=\"page\" title=\"Polski\">PL\u003c/a>\u003c/nav>\n\u003c/div>\u003c/header>\u003cmain id=\"main\" class=\"container v4-detail\">\n\u003ca class=\"v4-back\" href=\"/pl/\">\u003cspan aria-hidden=\"true\">←\u003c/span> Wróć do profilu\u003c/a>\n\u003cdiv class=\"v4-detail-intro\">\u003cspan class=\"v4-eyebrow\">MARIUSZ GORLOWSKI\u003c/span>\n\u003ch1>QR FINDER\u003c/h1>\u003cp>Od prostej metalowej zawieszki do systemu łączącego przedmioty fizyczne z przydatnymi informacjami.\u003c/p>\u003c/div>\n\u003cnav aria-label=\"Sekcje QR FINDER\" class=\"v4-tabs\">\u003ca class=\"active\" aria-current=\"page\" href=\"/pl/qr-finder/\">System\u003c/a>\u003ca class=\"\" href=\"/pl/qr-finder/articles/\">Artykuły i aktualności\u003c/a>\u003ca class=\"\" href=\"/pl/contact/?topic=qr\">Kontakt\u003c/a>\u003c/nav>\u003cdiv class=\"v4-content-stack\">\u003csection aria-labelledby=\"qr-title\" class=\"paper-card qr-card\" id=\"qr-finder\">\n\u003cdiv class=\"section-label\">04 / Technologia i przedsiębiorczość\u003c/div>\n\u003cdiv class=\"qr-heading\">\u003cdiv>\u003ch2 id=\"qr-title\">QR FINDER\u003c/h2>\u003cdiv class=\"v4-book-status v4-project-status v4-status-search\">\u003cspan class=\"v4-status-dot\" aria-hidden=\"true\">\u003c/span>\u003cspan>\u003cstrong>Aktualny status:\u003c/strong> Przygotowania do publicznego uruchomienia.\u003c/span>\u003c/div>\u003c/div>\u003cspan aria-hidden=\"true\" class=\"qr-mark\">▦\u003c/span>\u003c/div>\n\u003cdiv class=\"qr-intro\">\n\u003cdiv>\n\u003ch3>Ktoś znalazł Twoją zgubę. Co dalej?\u003c/h3>\n\u003cp>Klucze zostawione w kawiarni. Walizka zagubiona w podróży. Pies, który uciekł podczas spaceru.\u003c/p>\n\u003cp>To różne sytuacje, ale łączy je jeden problem: nawet jeśli ktoś odnajdzie zgubę, może nie mieć jak skontaktować się z jej właścicielem.\u003c/p>\n\u003cp>Właśnie ten problem skłonił mnie do stworzenia QR FINDER.\u003c/p>\n\u003ch3>Od niewielkiej zawieszki do całego systemu\u003c/h3>\n\u003cp>Wszystko zaczęło się od pomysłu na dobrze zaprojektowaną metalową zawieszkę — estetyczną i trwałą, ale przede wszystkim użyteczną. Od początku chciałem, aby oferowała coś więcej niż sam kod.\u003c/p>\n\u003cp>Na tradycyjnych zawieszkach często graweruje się numer telefonu lub inne dane. Gdy informacje się zmieniają, zawieszkę trzeba wymienić. Chciałem połączyć fizyczny przedmiot z profilem cyfrowym, który można aktualizować.\u003c/p>\n\u003cp>Z tej idei QR FINDER rozwinął się w system metalowych zawieszek, naklejek informacyjnych i platformy internetowej przystosowanej do telefonów. W trakcie prac pojawiały się kolejne produkty, funkcje i zastosowania.\u003c/p>\n\u003c/div>\n\u003cfigure class=\"founder-photo\">\u003cimg alt=\"Mariusz Gorlowski w białej koszuli w pracowni QR FINDER\" height=\"1484\" loading=\"lazy\" src=\"/assets/founder_white.webp\" width=\"1500\"/>\u003cfigcaption>Za kulisami projektu\u003c/figcaption>\u003c/figure>\n\u003c/div>\n\u003cdiv class=\"product-photo\">\u003cimg alt=\"Wizualizacja czterech wykończeń metalowych zawieszek QR FINDER: miedź, stal, mosiądz i aluminium\" height=\"941\" loading=\"lazy\" src=\"/assets/tags.webp\" width=\"1672\"/>\u003cspan>Wizualizacja projektu · cztery warianty wykończenia\u003c/span>\u003c/div>\n\u003chr class=\"v4-gold-rule\" aria-hidden=\"true\"/>\n\u003csection class=\"v4-qr-topic\" aria-labelledby=\"how-it-works\">\u003ch3 id=\"how-it-works\">Jak to działa?\u003c/h3>\n\u003cdiv class=\"feature-grid\">\n\u003cdiv>\u003cstrong>1. Znalazca nie potrzebuje aplikacji\u003c/strong>\u003cp>Zeskanowanie kodu powiązanego z publicznym profilem otwiera widok znalazcy (Finder View). Osoba, która znajdzie przedmiot lub zwierzę, może zobaczyć udostępnione przez właściciela informacje i skorzystać z dostępnych sposobów kontaktu — bez instalowania aplikacji i zakładania konta.\u003c/p>\u003c/div>\n\u003cdiv>\u003cstrong>2. Informacje można aktualizować\u003c/strong>\u003cp>Zmieniasz numer telefonu albo chcesz poprawić dane zwierzęcia? Wystarczy zaktualizować profil cyfrowy, bez wymiany zawieszki lub naklejki.\u003c/p>\u003c/div>\n\u003cdiv>\u003cstrong>3. Sam decydujesz, co udostępniasz\u003c/strong>\u003cp>Nie każda informacja zapisana w profilu musi być widoczna. Właściciel wybiera, jakie dodatkowe dane udostępnić znalazcy, a jakie zachować jako prywatne.\u003c/p>\u003c/div>\n\u003cdiv>\u003cstrong>4. Tryb zagubienia (Lost Mode)\u003c/strong>\u003cp>Po włączeniu trybu zagubienia skan kodu może wyświetlić wyraźny komunikat „Zgłoszono zaginięcie”. Jeśli powiadomienia są aktywne, właściciel może otrzymać datę i godzinę skanowania. Znalazca może dobrowolnie udostępnić swoją lokalizację — system nie śledzi jej automaty
